<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>İlaç Saatim</title>
<meta name="description" content="İlaçlarını, ölçümlerini ve doktor randevularını tek yerde takip et. Saati gelince hatırlatsın.">
<meta name="theme-color" content="#0E1530">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="İlaç Saatim">
<link rel="apple-touch-icon" sizes="180x180" href="/ilac/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/ilac/icon-192.png">
<link rel="manifest" href="/ilac/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F0E6; --bg2:#FBF8F1; --card:#FFFFFF; --card2:#FAF7F0; --field:#FBF9F4; --line:#E7DFCD; --line2:#EFE9DC;
  --ink:#141A2E; --ink2:#353D57; --muted:#7A8096;
  --em:#1E2A55; --em2:#3A4C8A; --em-soft:#E7EAF4;
  --gold:#B48D45; --gold2:#E6CF9C; --gold-deep:#86672B; --gold-soft:#F6EEDB;
  --ok:#1E7A4C; --ok-soft:#E1F2E7; --warn:#A8701A; --warn-soft:#FAEFD8; --bad:#B23B3B; --bad-soft:#F8E4E1;
  --shadow:0 1px 2px rgba(20,26,46,.04),0 10px 30px -8px rgba(20,26,46,.12);
  --shadow-lg:0 24px 60px -12px rgba(8,12,30,.4);
  --glass:rgba(255,253,248,.82); --scrim:rgba(6,9,22,.5);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-tema="acik"]){
    --bg:#07080F; --bg2:#0C0F1C; --card:#10131F; --card2:#141826; --field:#0B0E19; --line:#242A3B; --line2:#1C2131;
    --ink:#EEEAE0; --ink2:#CBD1CB; --muted:#8B9994;
    --em:#93A9EC; --em2:#B3C3F2; --em-soft:#171F3C;
    --gold:#D9B66C; --gold2:#F1DBA8; --gold-deep:#E9C882; --gold-soft:#2A2314;
    --ok:#5DD39A; --ok-soft:#11301F; --warn:#F0B54A; --warn-soft:#322610; --bad:#F08A80; --bad-soft:#3A1A19;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -8px rgba(0,0,0,.55);
    --glass:rgba(16,28,25,.84); --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-tema="koyu"]{
  --bg:#07080F; --bg2:#0C0F1C; --card:#10131F; --card2:#141826; --field:#0B0E19; --line:#242A3B; --line2:#1C2131;
  --ink:#EEEAE0; --ink2:#CBD1CB; --muted:#8B9994;
  --em:#93A9EC; --em2:#B3C3F2; --em-soft:#171F3C;
  --gold:#D9B66C; --gold2:#F1DBA8; --gold-deep:#E9C882; --gold-soft:#2A2314;
  --ok:#5DD39A; --ok-soft:#11301F; --warn:#F0B54A; --warn-soft:#322610; --bad:#F08A80; --bad-soft:#3A1A19;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -8px rgba(0,0,0,.55);
  --glass:rgba(16,28,25,.84); --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px;background:var(--bg)}
html.buyuk{font-size:18.5px}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif;color:var(--ink);min-height:100vh;line-height:1.45;
  background:radial-gradient(120% 50% at 50% -10%,var(--bg2) 0%,var(--bg) 60%) fixed,var(--bg);
  padding:env(safe-area-inset-top) 0 calc(8.5rem + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
.serif{font-family:Fraunces,Georgia,serif;font-optical-sizing:auto}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:580px;margin:0 auto;padding:0 1rem}
.i{display:block;flex:0 0 auto}
[hidden]{display:none!important}
.muted{color:var(--muted)}

/* Üst bölüm */
.top{display:flex;align-items:center;gap:.75rem;padding:1.1rem 0 .4rem}
.avatar{width:2.75rem;height:2.75rem;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-size:1rem;
  box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--gold2);flex:0 0 auto;position:relative}
.avatar small{position:absolute;right:-3px;bottom:-3px;width:1.1rem;height:1.1rem;border-radius:50%;background:var(--gold);color:#fff;display:grid;place-items:center;font-size:.6rem;box-shadow:0 0 0 2px var(--bg)}
.hello{flex:1;min-width:0}
.hello .eyebrow{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-deep);font-weight:700}
.hello h1{font-family:Fraunces,serif;font-weight:600;font-size:1.6rem;letter-spacing:-.02em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:2.75rem;height:2.75rem;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--ink2);flex:0 0 auto}

/* Hafta şeridi */
.week{display:flex;align-items:center;gap:.25rem;margin:.9rem 0 1rem}
.week .nav{width:1.9rem;height:3.9rem;display:grid;place-items:center;color:var(--muted);border-radius:12px}
.days{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:.3rem}
.day{display:flex;flex-direction:column;align-items:center;gap:.2rem;padding:.45rem 0 .5rem;border-radius:16px;position:relative;transition:.2s}
.day .dn{font-size:.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.day .dr{position:relative;width:2.1rem;height:2.1rem;display:grid;place-items:center}
.day .dr svg{position:absolute;inset:0;transform:rotate(-90deg)}
.day .dr b{font-size:.92rem;font-weight:800;position:relative}
.day.sel{background:linear-gradient(180deg,#22305F,#111A3A);box-shadow:0 8px 20px -8px rgba(17,26,58,.7)}
.day.sel .dn{color:var(--gold2)} .day.sel .dr b{color:#fff}
.day.today:not(.sel) .dr b{color:var(--gold-deep)}
.day.today::after{content:"";position:absolute;bottom:.18rem;width:4px;height:4px;border-radius:50%;background:var(--gold)}

/* Ana kart */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:1.35rem 1.35rem 1.1rem;color:#F4EFE3;
  background:radial-gradient(90% 70% at 100% 0%,rgba(230,207,156,.24),transparent 60%),radial-gradient(60% 60% at 0% 100%,rgba(120,150,230,.18),transparent 60%),linear-gradient(150deg,#0E1530 0%,#18234A 55%,#0B1128 100%);
  box-shadow:var(--shadow-lg);margin-bottom:1rem;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(140deg,rgba(241,219,168,.55),rgba(241,219,168,0) 40%,rgba(241,219,168,.25));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.hero::after{content:"";position:absolute;right:-60px;bottom:-80px;width:220px;height:220px;border-radius:50%;border:1px solid rgba(241,219,168,.12);box-shadow:0 0 0 30px rgba(241,219,168,.03),0 0 0 60px rgba(241,219,168,.02);z-index:-1}
.hero-row{display:flex;align-items:center;gap:1rem}
.hero .eyebrow{font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:#E6CF9C;font-weight:700}
.hero h2{font-family:Fraunces,serif;font-weight:600;font-size:2.1rem;line-height:1.05;margin:.3rem 0 .25rem;letter-spacing:-.02em}
.hero h2 span{font-size:1.1rem;color:rgba(244,239,227,.6);font-weight:500}
.hero .sub{color:rgba(244,239,227,.72);font-size:.9rem;font-weight:500}
.ring-big{position:relative;width:7rem;height:7rem;flex:0 0 7rem;margin-left:auto}
.ring-big svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring-big .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-big .c b{font-family:Fraunces,serif;font-size:1.65rem;font-weight:600;line-height:1}
.ring-big .c small{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:#E6CF9C;margin-top:.2rem;font-weight:700}
.next{margin-top:1.1rem;display:flex;align-items:center;gap:.8rem;background:rgba(255,255,255,.07);border:1px solid rgba(241,219,168,.16);border-radius:18px;padding:.7rem .8rem;backdrop-filter:blur(6px)}
.next .np{width:2.9rem;height:2.9rem;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.22),rgba(255,255,255,.04));border-radius:14px;flex:0 0 auto}
.next .nt{flex:1;min-width:0}
.next .nt small{display:block;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:#E6CF9C;font-weight:700}
.next .nt b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next .cd{font-weight:800;font-size:.82rem;padding:.4rem .65rem;border-radius:99px;background:linear-gradient(180deg,#F1DBA8,#D2AE66);color:#2B210D;white-space:nowrap}
.next .cd.late{background:linear-gradient(180deg,#F5B3A8,#E0766A);color:#3A0E0A}
.hero-foot{display:flex;gap:.5rem;margin-top:.85rem;flex-wrap:wrap}
.hero-foot span{display:inline-flex;align-items:center;gap:.35rem;font-size:.8rem;font-weight:700;color:rgba(244,239,227,.85);padding:.3rem .6rem;border-radius:99px;background:rgba(255,255,255,.06)}
.hero-foot .i{color:#E6CF9C}

/* Uyarı kartları */
.notice{display:flex;align-items:center;gap:.8rem;padding:.85rem 1rem;border-radius:18px;margin-bottom:.7rem;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);font-size:.92rem}
.notice .ni{width:2.4rem;height:2.4rem;border-radius:12px;display:grid;place-items:center;flex:0 0 auto}
.notice .nt{flex:1;min-width:0}
.notice .nt b{display:block;font-weight:700}
.notice .nt span{color:var(--muted);font-size:.84rem;font-weight:500}
.n-warn .ni{background:var(--warn-soft);color:var(--warn)}
.n-gold .ni{background:var(--gold-soft);color:var(--gold-deep)}
.n-em .ni{background:var(--em-soft);color:var(--em)}
.pill-btn{padding:.5rem .85rem;border-radius:99px;font-weight:700;font-size:.82rem;background:var(--em-soft);color:var(--em);white-space:nowrap}

/* Bölüm başlıkları */
.sec{display:flex;align-items:center;gap:.55rem;margin:1.4rem 0 .7rem}
.sec .si{width:2rem;height:2rem;border-radius:10px;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold-deep)}
.sec h3{font-family:Fraunces,serif;font-weight:600;font-size:1.2rem;letter-spacing:-.01em}
.sec .sc{margin-left:auto;font-size:.8rem;font-weight:700;color:var(--muted)}
.title{font-family:Fraunces,serif;font-weight:600;font-size:1.95rem;letter-spacing:-.02em;margin:1.1rem 0 .2rem}
.lead{color:var(--muted);font-weight:500;margin-bottom:1rem}

/* Doz kartı */
.dz{display:flex;align-items:center;gap:.85rem;padding:.8rem .8rem .8rem .7rem;border-radius:22px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:.6rem;position:relative;transition:transform .15s,opacity .3s}
.dz:active{transform:scale(.985)}
.dz-pill{width:3.6rem;height:3.6rem;border-radius:18px;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,var(--card),var(--card2));border:1px solid var(--line2);flex:0 0 auto}
.dz-info{flex:1;min-width:0}
.dz-name{font-weight:800;font-size:1.05rem;line-height:1.2;overflow-wrap:anywhere}
.dz-name span{font-weight:600;color:var(--muted);font-size:.85rem}
.dz-sub{color:var(--ink2);font-size:.86rem;font-weight:500;margin-top:.1rem}
.dz-meta{display:flex;align-items:center;gap:.4rem;margin-top:.35rem;flex-wrap:wrap}
.time{display:inline-flex;align-items:center;gap:.25rem;font-weight:800;font-size:.82rem;color:var(--ink)}
.tag{font-size:.7rem;font-weight:800;padding:.18rem .5rem;border-radius:99px;letter-spacing:.02em}
.t-ok{background:var(--ok-soft);color:var(--ok)} .t-late{background:var(--bad-soft);color:var(--bad)}
.t-now{background:var(--warn-soft);color:var(--warn)} .t-wait{background:var(--em-soft);color:var(--em)}
.t-skip,.t-missed{background:var(--line2);color:var(--muted)} .t-who{background:var(--gold-soft);color:var(--gold-deep)}
.chk{width:3rem;height:3rem;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);color:transparent;flex:0 0 auto;transition:.25s;background:var(--field)}
.chk.on{border-color:transparent;color:#2B210D;background:linear-gradient(160deg,#F1DBA8,#C9A256);box-shadow:0 6px 16px -6px rgba(180,141,69,.8);animation:pop .35s ease}
.chk.sk{border-style:dashed;color:var(--muted)}
.st-now .chk,.st-late .chk{border-color:var(--gold);color:var(--gold);animation:glow 1.8s ease-in-out infinite}
.st-ok{opacity:.72}
.st-ok .dz-name{text-decoration:line-through;text-decoration-color:var(--gold);text-decoration-thickness:2px}
.st-late{border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(201,162,86,.45)}50%{box-shadow:0 0 0 8px rgba(201,162,86,0)}}

.empty{text-align:center;padding:2rem 1.2rem 1.6rem;border-radius:28px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.empty .art{display:flex;justify-content:center;align-items:flex-end;gap:.2rem;margin-bottom:.8rem}
.empty h3{font-family:Fraunces,serif;font-size:1.5rem;font-weight:600}
.empty p{color:var(--muted);margin:.4rem auto 1.2rem;max-width:22rem;font-weight:500}

/* Düğmeler */
.btn{display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;padding:1rem 1.2rem;border-radius:18px;font-weight:800;font-size:1rem;
  background:linear-gradient(180deg,#26356A,#121A3A);color:#F6EEDB;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 10px 24px -10px rgba(18,26,58,.8)}
.btn.gold{background:linear-gradient(180deg,#F0D7A0,#C69E55);color:#2B210D;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 24px -10px rgba(180,141,69,.9)}
.btn.soft{background:var(--em-soft);color:var(--em);box-shadow:none}
.btn.line{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.danger{background:var(--bad-soft);color:var(--bad);box-shadow:none}
.btn:disabled{opacity:.55}
.btn.sm{padding:.7rem 1rem;font-size:.9rem;border-radius:14px;width:auto}
.btns{display:flex;gap:.6rem}
.btns>*{flex:1;min-width:0}
.btns>.btn{padding-left:.7rem;padding-right:.7rem;white-space:nowrap;font-size:.95rem}
input[type=date].inp,input[type=time].inp{min-width:0;width:100%;-webkit-appearance:none;appearance:none;display:block}

/* İlaç kartları */
.seg{display:flex;padding:.25rem;border-radius:16px;background:var(--card2);border:1px solid var(--line);margin-bottom:1rem;gap:.2rem}
.seg button{flex:1;padding:.6rem .3rem;border-radius:12px;font-weight:700;font-size:.85rem;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.medc{display:flex;align-items:center;gap:.9rem;padding:.9rem;border-radius:24px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:.7rem}
.medc .mp{width:4.4rem;height:4.4rem;border-radius:20px;display:grid;place-items:center;flex:0 0 auto;
  background:radial-gradient(circle at 50% 30%,var(--card) 0%,var(--card2) 70%);border:1px solid var(--line2)}
.medc .mb{flex:1;min-width:0}
.medc .mn{font-weight:800;font-size:1.08rem;overflow-wrap:anywhere;line-height:1.25}
.medc .mn span{font-weight:600;color:var(--muted);font-size:.85rem}
.medc .ms{color:var(--ink2);font-size:.85rem;font-weight:500;margin-top:.1rem}
.stock{display:flex;align-items:center;gap:.5rem;margin-top:.45rem}
.stock .bar{flex:1;height:6px;border-radius:9px;background:var(--line2);overflow:hidden}
.stock .bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--em2),var(--em))}
.stock .bar.low i{background:linear-gradient(90deg,#E9A04B,#D4663F)}
.stock span{font-size:.75rem;font-weight:700;color:var(--muted);white-space:nowrap}
.stock span.low{color:var(--bad)}
.chev{color:var(--muted)}

/* Alttan açılan pencere */
.sheet-bg{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease;backdrop-filter:blur(3px)}
.sheet{background:var(--bg);width:100%;max-width:580px;max-height:94vh;overflow:auto;overscroll-behavior:contain;border-radius:30px 30px 0 0;
  padding:.6rem 1.1rem calc(1.4rem + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.9,.3,1);box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet.full{height:94vh}
.grip{width:2.8rem;height:5px;border-radius:9px;background:var(--line);margin:.2rem auto .8rem}
.sh-head{display:flex;align-items:center;gap:.6rem;margin-bottom:1rem}
.sh-head h3{flex:1;font-family:Fraunces,serif;font-weight:600;font-size:1.45rem;letter-spacing:-.01em}
.closex{width:2.4rem;height:2.4rem;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--muted)}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* Form */
.fg{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:1rem;margin-bottom:.8rem;box-shadow:var(--shadow)}
.fg>label,.lbl{display:block;font-weight:800;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-deep);margin-bottom:.6rem}
.lbl2{display:block;font-weight:700;font-size:.88rem;margin:.9rem 0 .5rem;color:var(--ink2)}
.inp{width:100%;border:1px solid var(--line);background:var(--field);border-radius:14px;padding:.85rem .95rem;font-weight:600;font-size:1.02rem;outline:none;min-height:3.2rem;transition:.15s}
.inp:focus{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
textarea.inp{min-height:5rem;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chips button{padding:.6rem .9rem;border-radius:99px;border:1px solid var(--line);background:var(--field);font-weight:700;font-size:.88rem;color:var(--ink2);transition:.15s}
.chips button.on{background:linear-gradient(180deg,#26356A,#121A3A);border-color:transparent;color:#F6EEDB}
.forms{display:grid;grid-template-columns:repeat(5,1fr);gap:.45rem}
.forms button{display:flex;flex-direction:column;align-items:center;gap:.15rem;padding:.5rem .1rem .45rem;border-radius:16px;border:1px solid var(--line);background:var(--field);font-size:.66rem;font-weight:700;color:var(--muted);line-height:1.15;text-align:center}
.forms button.on{border-color:var(--gold);background:var(--gold-soft);color:var(--gold-deep);box-shadow:0 0 0 3px var(--gold-soft)}
.colors{display:flex;flex-wrap:wrap;gap:.5rem}
.colors button{width:2.3rem;height:2.3rem;border-radius:50%;box-shadow:inset 0 -3px 6px rgba(0,0,0,.15),inset 0 2px 4px rgba(255,255,255,.6),0 0 0 1px rgba(0,0,0,.08);transition:.15s}
.colors button.on{box-shadow:inset 0 -3px 6px rgba(0,0,0,.15),inset 0 2px 4px rgba(255,255,255,.6),0 0 0 3px var(--bg),0 0 0 5px var(--gold)}
.stepper{display:flex;align-items:center;gap:.5rem}
.stepper button{width:3.2rem;height:3.2rem;border-radius:14px;border:1px solid var(--line);background:var(--field);font-size:1.4rem;font-weight:700;color:var(--em)}
.stepper b{min-width:3.4rem;text-align:center;font-family:Fraunces,serif;font-size:1.6rem;font-weight:600}
.trow{display:flex;gap:.5rem;margin-bottom:.5rem}
.trow .inp{flex:1}
.trow button{width:3.2rem;border-radius:14px;border:1px solid var(--line);background:var(--field);color:var(--bad);display:grid;place-items:center}
.preview{display:flex;align-items:center;gap:1rem;padding:1rem;border-radius:24px;margin-bottom:.8rem;color:#F4EFE3;position:relative;overflow:hidden;
  background:radial-gradient(70% 90% at 15% 50%,rgba(241,219,168,.25),transparent 70%),linear-gradient(150deg,#0E1530,#18234A)}
.preview .pv{width:5.2rem;height:5.2rem;display:grid;place-items:center;flex:0 0 auto}
.preview b{display:block;font-family:Fraunces,serif;font-size:1.35rem;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.preview span{color:rgba(244,239,227,.7);font-size:.85rem;font-weight:600}
.scan{display:flex;align-items:center;gap:.8rem;width:100%;padding:.9rem 1rem;border-radius:20px;margin-bottom:.8rem;text-align:left;
  border:1.5px dashed var(--gold);background:linear-gradient(180deg,var(--gold-soft),transparent);color:var(--ink)}
.scan .si{width:2.6rem;height:2.6rem;border-radius:14px;display:grid;place-items:center;background:linear-gradient(160deg,#F1DBA8,#C9A256);color:#2B210D;flex:0 0 auto}
.scan b{display:block;font-weight:800}
.scan span{font-size:.82rem;color:var(--muted);font-weight:500}
.hint{font-size:.8rem;color:var(--muted);font-weight:500;margin-top:.45rem}

/* Detay */
.dhero{text-align:center;padding:1.4rem 1rem 1.2rem;border-radius:28px;margin-bottom:.9rem;color:#F4EFE3;position:relative;overflow:hidden;
  background:radial-gradient(55% 55% at 50% 38%,rgba(241,219,168,.3),transparent 70%),linear-gradient(160deg,#0E1530,#1A2550 60%,#0B1230)}
.dhero .stage{width:8.5rem;height:8.5rem;margin:0 auto .3rem;display:grid;place-items:center;animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.dhero h2{font-family:Fraunces,serif;font-weight:600;font-size:1.8rem;line-height:1.15;overflow-wrap:anywhere}
.dhero p{color:rgba(244,239,227,.72);font-weight:600;font-size:.9rem;margin-top:.2rem}
.dchips{display:flex;justify-content:center;gap:.4rem;flex-wrap:wrap;margin-top:.7rem}
.dchips span{font-size:.75rem;font-weight:700;padding:.3rem .65rem;border-radius:99px;background:rgba(255,255,255,.09);border:1px solid rgba(241,219,168,.2)}
.kv{display:flex;justify-content:space-between;gap:1rem;padding:.65rem 0;border-bottom:1px solid var(--line2);font-size:.95rem}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted);font-weight:600}
.kv b{font-weight:700;text-align:right}
.ai{border-radius:22px;padding:1rem;background:linear-gradient(180deg,var(--gold-soft),var(--card));border:1px solid var(--line);margin-bottom:.8rem}
.ai h4{display:flex;align-items:center;gap:.4rem;font-weight:800;font-size:.95rem;margin:.7rem 0 .3rem}
.ai h4:first-child{margin-top:0}
.ai ul{padding-left:1.1rem;font-size:.92rem;font-weight:500;color:var(--ink2)}
.ai li{margin:.2rem 0}
.ai p{font-size:.92rem;font-weight:500;color:var(--ink2)}
.ai .disc{font-size:.75rem;color:var(--muted);margin-top:.8rem;font-weight:600}
.shimmer{height:.9rem;border-radius:6px;margin:.5rem 0;background:linear-gradient(90deg,var(--line2),var(--card),var(--line2));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

/* Sağlık */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.65rem}
.tile{padding:.9rem;border-radius:22px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;gap:.2rem;min-height:9.5rem;position:relative;overflow:hidden}
.tile .ti{width:2.3rem;height:2.3rem;border-radius:12px;display:grid;place-items:center;margin-bottom:.35rem}
.tile .tn{font-size:.78rem;font-weight:700;color:var(--muted)}
.tile .tv{font-family:Fraunces,serif;font-size:1.55rem;font-weight:600;line-height:1.1}
.tile .tv small{font-family:"Plus Jakarta Sans",sans-serif;font-size:.72rem;color:var(--muted);font-weight:600;margin-left:.2rem}
.tile .spark{margin-top:auto;height:28px}
.tile .tag{position:absolute;top:.9rem;right:.8rem}
.appt{display:flex;gap:.9rem;align-items:center;padding:.9rem;border-radius:22px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:.6rem}
.appt .ad{width:3.6rem;flex:0 0 auto;text-align:center;border-radius:16px;padding:.45rem 0;background:linear-gradient(170deg,#F1DBA8,#C9A256);color:#2B210D}
.appt .ad b{display:block;font-family:Fraunces,serif;font-size:1.5rem;line-height:1}
.appt .ad small{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.appt .ab{flex:1;min-width:0}
.appt .ab b{display:block;font-weight:800;overflow-wrap:anywhere}
.appt .ab span{display:block;font-size:.84rem;color:var(--muted);font-weight:600}
.appt.past{opacity:.6}
.appt.past .ad{background:var(--line2);color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.mlist .kv b small{color:var(--muted);font-weight:600}

/* Rapor */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.55rem;margin-bottom:.8rem}
.stat{padding:.85rem .6rem;border-radius:20px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);text-align:center}
.stat b{display:block;font-family:Fraunces,serif;font-size:1.65rem;font-weight:600;line-height:1.1}
.stat span{font-size:.72rem;font-weight:700;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:1rem;box-shadow:var(--shadow);margin-bottom:.8rem}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:.35rem}
.heat div{aspect-ratio:1;border-radius:8px;background:var(--line2);position:relative}
.heat div.t{box-shadow:0 0 0 2px var(--gold)}
.heat .h-head{background:none;aspect-ratio:auto;font-size:.65rem;font-weight:700;color:var(--muted);text-align:center}
.legend{display:flex;align-items:center;gap:.3rem;justify-content:flex-end;font-size:.7rem;color:var(--muted);font-weight:600;margin-top:.6rem}
.legend i{width:.8rem;height:.8rem;border-radius:3px;display:inline-block}
.mrow{display:flex;align-items:center;gap:.7rem;padding:.55rem 0}
.mrow .mb{flex:1;min-width:0}
.mrow b{font-weight:700;font-size:.92rem}
.mrow .bar{height:8px;border-radius:9px;background:var(--line2);overflow:hidden;margin-top:.3rem}
.mrow .bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#C9A256,#F1DBA8)}
.mrow em{font-style:normal;font-weight:800;font-size:.9rem}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:.55rem}
.badge{text-align:center;padding:.85rem .4rem;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.badge .md{width:3.3rem;height:3.3rem;margin:0 auto .45rem;border-radius:50%;display:grid;place-items:center;font-size:1.5rem;
  background:radial-gradient(circle at 35% 30%,#FFF4D6,#E3C27F 45%,#A97F35);box-shadow:inset 0 -3px 6px rgba(0,0,0,.2),0 6px 14px -6px rgba(169,127,53,.8)}
.badge b{display:block;font-size:.78rem;font-weight:800;line-height:1.2}
.badge span{display:block;font-size:.66rem;color:var(--muted);font-weight:600;margin-top:.15rem;line-height:1.25}
.badge.lock{opacity:.5}
.badge.lock .md{background:var(--line2);box-shadow:none;filter:grayscale(1)}

/* Ayarlar */
.set{display:flex;align-items:center;gap:.8rem;padding:.8rem 0;border-bottom:1px solid var(--line2)}
.set:last-child{border-bottom:0}
.set .sic{width:2.4rem;height:2.4rem;border-radius:12px;display:grid;place-items:center;background:var(--em-soft);color:var(--em);flex:0 0 auto}
.set .st{flex:1;min-width:0}
.set .st b{display:block;font-weight:700}
.set .st small{color:var(--muted);font-weight:500;font-size:.8rem}
.sw{width:3.3rem;height:2rem;border-radius:99px;background:var(--line);position:relative;flex:0 0 auto;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:1.6rem;height:1.6rem;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.sw.on{background:linear-gradient(180deg,#26356A,#121A3A)}
.sw.on::after{left:calc(100% - 1.6rem - 3px)}
.prof{display:flex;align-items:center;gap:.8rem;padding:.75rem;border-radius:18px;border:1px solid var(--line);background:var(--card);margin-bottom:.5rem;width:100%;text-align:left}
.prof.on{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.prof .avatar{width:2.6rem;height:2.6rem}
.prof .pb{flex:1}
.prof .pb b{display:block;font-weight:800}
.prof .pb small{color:var(--muted);font-weight:600}

/* Alt menü */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(.8rem + env(safe-area-inset-bottom));width:calc(100% - 1.6rem);max-width:540px;z-index:30;
  display:grid;grid-template-columns:1fr 1fr 4.4rem 1fr 1fr;align-items:center;padding:.4rem;border-radius:28px;
  background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);box-shadow:0 18px 40px -12px rgba(0,0,0,.28)}
.tabbar .tb{display:flex;flex-direction:column;align-items:center;gap:.15rem;padding:.5rem 0;border-radius:20px;font-size:.68rem;font-weight:700;color:var(--muted);transition:.2s}
.tabbar .tb.on{color:var(--em)}
.tabbar .tb.on .i{transform:translateY(-1px)}
.tabbar .tb.on::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--gold);margin-top:.05rem}
.tabbar .tb:not(.on)::after{content:"";width:4px;height:4px;margin-top:.05rem}
.fab{width:3.9rem;height:3.9rem;border-radius:50%;margin:-1.6rem auto 0;display:grid;place-items:center;color:#2B210D;
  background:linear-gradient(160deg,#F4DFAE,#C69E55);box-shadow:0 0 0 5px var(--bg),0 14px 26px -8px rgba(180,141,69,.9),inset 0 1px 0 rgba(255,255,255,.6);transition:.2s}
.fab:active{transform:scale(.94)}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.menu button{display:flex;flex-direction:column;align-items:flex-start;gap:.5rem;padding:1rem;border-radius:22px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);text-align:left}
.menu button .mi{width:2.6rem;height:2.6rem;border-radius:14px;display:grid;place-items:center}
.menu button b{font-weight:800}
.menu button span{font-size:.78rem;color:var(--muted);font-weight:500;line-height:1.3}

/* Hatırlatma ekranı */
.alarm{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(1.5rem + env(safe-area-inset-top)) 1.3rem calc(1.5rem + env(safe-area-inset-bottom));color:#F4EFE3;text-align:center;
  background:radial-gradient(60% 45% at 50% 32%,rgba(241,219,168,.28),transparent 70%),linear-gradient(170deg,#0B1230,#141E42 50%,#05070F);animation:fade .3s ease;overflow:auto}
.alarm .rings{position:relative;width:11rem;height:11rem;display:grid;place-items:center;margin-bottom:1rem;flex:0 0 auto}
.alarm .rings i{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(241,219,168,.5);animation:ripple 2.4s ease-out infinite}
.alarm .rings i:nth-child(2){animation-delay:.8s} .alarm .rings i:nth-child(3){animation-delay:1.6s}
@keyframes ripple{from{transform:scale(.55);opacity:1}to{transform:scale(1.35);opacity:0}}
.alarm .rings .core{width:7.5rem;height:7.5rem;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.2),rgba(255,255,255,.04));border:1px solid rgba(241,219,168,.35);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.alarm .eyebrow{font-size:.75rem;letter-spacing:.24em;text-transform:uppercase;color:#E6CF9C;font-weight:800}
.alarm .big{font-family:Fraunces,serif;font-size:4rem;font-weight:600;line-height:1;margin:.3rem 0 .2rem;letter-spacing:-.02em}
.alarm .al{width:100%;max-width:400px;margin:1rem 0 1.2rem}
.alarm .al div{display:flex;align-items:center;gap:.7rem;padding:.7rem .8rem;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid rgba(241,219,168,.16);margin-bottom:.5rem;text-align:left}
.alarm .al b{display:block;font-weight:800}
.alarm .al small{display:block;color:rgba(244,239,227,.7);font-weight:600;font-size:.82rem}
.alarm .acts{width:100%;max-width:400px;display:flex;flex-direction:column;gap:.55rem}
.alarm .btn.line{background:rgba(255,255,255,.07);color:#F4EFE3;border-color:rgba(241,219,168,.2)}

/* Karşılama */
.onb{position:fixed;inset:0;z-index:95;display:flex;flex-direction:column;justify-content:flex-end;color:#F4EFE3;overflow:auto;
  background:radial-gradient(70% 45% at 50% 25%,rgba(241,219,168,.3),transparent 70%),linear-gradient(170deg,#0B1230,#151F45 50%,#05070F);padding:calc(1rem + env(safe-area-inset-top)) 1.4rem calc(1.6rem + env(safe-area-inset-bottom))}
.onb .art{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:15rem;margin-top:1.2rem}
.onb .art .p{position:absolute;animation:float 6s ease-in-out infinite}
.onb h1{font-family:Fraunces,serif;font-weight:600;font-size:2.5rem;line-height:1.05;letter-spacing:-.02em}
.onb h1 em{font-style:italic;color:#E6CF9C}
.onb p{color:rgba(244,239,227,.75);font-weight:500;margin:.7rem 0 1.3rem}
.onb .inp{background:rgba(255,255,255,.08);border-color:rgba(241,219,168,.25);color:#fff;margin-bottom:.8rem}
.onb .inp::placeholder{color:rgba(244,239,227,.5)}
.onb ul{list-style:none;display:grid;gap:.5rem;margin-bottom:1.3rem}
.onb li{display:flex;gap:.6rem;align-items:center;font-weight:600;font-size:.92rem;color:rgba(244,239,227,.88)}
.onb li .i{color:#E6CF9C}

.toast{position:fixed;left:50%;bottom:calc(6.8rem + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:99;opacity:0;pointer-events:none;transition:.3s cubic-bezier(.2,.9,.3,1);
  background:#141A2E;color:#F4EFE3;padding:.8rem 1.1rem;border-radius:16px;font-weight:700;font-size:.92rem;box-shadow:0 14px 30px -10px rgba(0,0,0,.5);max-width:90vw;text-align:center;border:1px solid rgba(241,219,168,.2)}
.toast.show{opacity:1;transform:translate(-50%,0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:98}
.celebrate{position:fixed;inset:0;z-index:97;display:grid;place-items:center;background:var(--scrim);animation:fade .2s;padding:1.2rem}
.celebrate .box{background:var(--card);border-radius:30px;padding:1.6rem 1.3rem 1.2rem;text-align:center;max-width:340px;width:100%;animation:up .35s cubic-bezier(.2,.9,.3,1);border:1px solid var(--line)}
.celebrate .md{width:5.5rem;height:5.5rem;margin:0 auto .8rem;border-radius:50%;display:grid;place-items:center;font-size:2.6rem;background:radial-gradient(circle at 35% 30%,#FFF4D6,#E3C27F 45%,#A97F35);box-shadow:inset 0 -4px 8px rgba(0,0,0,.2),0 12px 26px -8px rgba(169,127,53,.9);animation:pop .6s ease}
.celebrate h3{font-family:Fraunces,serif;font-size:1.5rem;font-weight:600}
.celebrate p{color:var(--muted);font-weight:500;margin:.3rem 0 1.1rem}

.foot{font-size:.75rem;color:var(--muted);font-weight:500;text-align:center;margin:1.4rem .5rem 0;line-height:1.5}

/* Doktor raporu (yazdırma) */
#rapor{position:fixed;inset:0;z-index:96;background:#fff;color:#111;overflow:auto;padding:1.2rem 1rem 6rem}
#rapor .rp{max-width:760px;margin:0 auto;font-size:13px}
#rapor .rh{display:flex;align-items:center;gap:12px;border-bottom:2px solid #1E2A55;padding-bottom:12px;margin-bottom:14px}
#rapor .rh img{width:44px;height:44px;border-radius:11px}
#rapor h1{font-family:Fraunces,serif;font-size:24px;font-weight:600;color:#1E2A55}
#rapor h2{font-family:Fraunces,serif;font-size:16px;margin:18px 0 8px;color:#1E2A55}
#rapor table{width:100%;border-collapse:collapse}
@media screen and (max-width:700px){#rapor table{display:block;overflow-x:auto;white-space:nowrap}#rapor h1{font-size:20px}}
#rapor th,#rapor td{border-bottom:1px solid #e3e3e3;padding:6px 6px;text-align:left;vertical-align:top}
#rapor th{background:#F4F0E6;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
#rapor .rbar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:.6rem;padding:.8rem 1rem calc(.8rem + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #ddd;justify-content:center}
#rapor .rbar .btn{max-width:260px}
@media print{
  body>*:not(#rapor){display:none!important}
  #rapor{position:static;padding:0;overflow:visible}
  #rapor .rbar{display:none}
  body{background:#fff;padding:0}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<nav class="tabbar" id="tabbar">
  <button class="tb on" data-t="bugun"></button>
  <button class="tb" data-t="ilaclar"></button>
  <button class="fab" onclick="ekleMenu()" aria-label="Ekle"></button>
  <button class="tb" data-t="saglik"></button>
  <button class="tb" data-t="rapor"></button>
</nav>

<div class="toast" id="toast"></div>
<canvas id="confetti"></canvas>
<input type="file" id="fotoInp" accept="image/*" capture="environment" hidden>
<input type="file" id="yedekInp" accept="application/json,.json" hidden>

<script>
"use strict";
/* =========================================================
   İlaç Saatim — tek sayfalık uygulama

  heart: P("M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7z"),
  chart: P("M3 3v18h18M7 15l4-4 3 3 6-7"),
  plus: P("M12 5v14M5 12h14"), x: P("M18 6 6 18M6 6l12 12"), check: P("M20 6 9 17l-5-5"),
  chevR: P("m9 18 6-6-6-6"), chevL: P("m15 18-6-6 6-6"),
  bell: P("M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"),
  clock: C(12, 12, 9) + P("M12 7v5l3 2"),
  cal: '<rect x="3" y="4" width="18" height="18" rx="3"/>' + P("M16 2v4M8 2v4M3 10h18"),
  calplus: '<rect x="3" y="4" width="18" height="18" rx="3"/>' + P("M16 2v4M8 2v4M3 10h18M12 14v5M9.5 16.5h5"),
  camera: P("M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z") + C(12, 13, 3.5),
  spark: P("M12 3l1.8 5.4L19 10l-5.2 1.6L12 17l-1.8-5.4L5 10l5.2-1.6zM19 16l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"),
  flame: P("M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"),
  sun: C(12, 12, 4) + P("M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"),
  sunrise: P("M12 2v7M4.93 10.93l1.41 1.41M2 18h2M20 18h2M19.07 10.93l-1.41 1.41M22 22H2M8 6l4-4 4 4M16 18a4 4 0 0 0-8 0"),
  sunset: P("M12 9V2M4.93 10.93l1.41 1.41M2 18h2M20 18h2M19.07 10.93l-1.41 1.41M22 22H2M16 5l-4 4-4-4M16 18a4 4 0 0 0-8 0"),
  moon: P("M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"),

function planliMi(m, g) {

  const s = durum(d), m = d.m, k = kayitAl(d), bugunMu = gun === bugun(), gelecek = gun > bugun();
  let act = "";
  if (d.prn) act = `<button class="btn danger" onclick="geriAl('${pid}','${key}','${gun}');sheetKapat();ciz()">${ic("trash", 18)} Bu kaydı sil</button>`;
  else if (k) act = `<button class="btn line" onclick="geriAl('${pid}','${key}','${gun}');sheetKapat();ciz()">İşareti geri al</button>`;
  else if (!gelecek) act = `<button class="btn gold" onclick="al('${pid}','${key}','${gun}');sheetKapat();ciz()">${ic("check", 20, 2.4)} ${bugunMu ? "Aldım" : "Bu dozu almıştım"}</button>
    ${bugunMu ? `<div class="btns" style="margin-top:.55rem"><button class="btn soft" onclick="ertele('${pid}','${key}','${gun}',10)">10 dk ertele</button><button class="btn soft" onclick="ertele('${pid}','${key}','${gun}',30)">30 dk ertele</button></div>` : ""}
    <button class="btn line" style="margin-top:.55rem" onclick="atla('${pid}','${key}','${gun}');sheetKapat();ciz()">${ic("skip", 18)} Bu dozu atla</button>`;
  sheetAc(`<div class="sh-head"><h3>${esc(d.saat)} dozu</h3><button class="closex" onclick="sheetKapat()">${ic("x", 18)}</button></div>
    <div class="dhero" style="padding:1.1rem"><div class="stage" style="width:6.5rem;height:6.5rem">${hap(m.form, m.renk1, m.renk2, 100)}</div>
      <h2 style="font-size:1.5rem">${esc(m.ad)} ${esc(m.guc || "")}</h2><p>${esc(miktarYaz(m))}${m.nasil !== NASIL[0] ? " · " + esc(m.nasil) : ""}</p>
      <div class="dchips"><span>${tarihYaz(gun)}</span><span>${ETIKET[s][0]}${k && k.d === "ok" ? " · " + new Date(k.t).toTimeString().slice(0, 5) : ""}</span></div></div>
    ${m.not ? `<div class="notice n-gold"><div class="ni">${ic("note")}</div><div class="nt"><b>Not</b><span>${esc(m.not)}</span></div></div>` : ""}
    ${act}
    <button class="btn line" style="margin-top:.55rem" onclick="sheetKapat();ilacDetay('${m.id}')">İlaç bilgilerini gör ${ic("chevR", 18)}</button>`);
}
function ertele(pid, key, gun, n) {
  S.ertele[gun + "|" + pid + "|" + key] = Date.now() + n * 60000; kaydet();
  sheetKapat(); toast(`${n} dakika sonra tekrar hatırlatacağım`);
}
function sonAlim(pid, mid) {
  const p = prof(pid); let son = 0;
  for (let i = 0; i < 3; i++) { const g = gunEkle(bugun(), -i); for (const [k, v] of Object.entries(p.kayit[g] || {})) if (k.startsWith(mid + "@~") && v.t > son) son = v.t; }
  if (!son) return null;
  const f = Math.round((Date.now() - son) / 60000);
  return { t: son, f, metin: f < 1 ? "az önce" : `${sureYaz(f)} önce (${new Date(son).toTimeString().slice(0, 5)})` };
}
function prnAl(mid, onay) {
  const p = prof(), m = p.ilaclar.find(x => x.id === mid); if (!m) return;
  const son = sonAlim(p.id, mid);
  const bugunSay = Object.keys(p.kayit[bugun()] || {}).filter(k => k.startsWith(mid + "@~")).length;
  if (!onay && son && m.minAra && son.f < m.minAra * 60) {
    if (!confirm(`Son dozdan bu yana ${sureYaz(son.f)} geçti. Senin belirlediğin en kısa ara ${m.minAra} saat.\n\nYine de kaydedeyim mi?`)) return;
  }
  if (!onay && m.gunlukMax && bugunSay >= m.gunlukMax) {
    if (!confirm(`Bugün zaten ${bugunSay} kez aldın (günlük sınır: ${m.gunlukMax}).\n\nYine de kaydedeyim mi?`)) return;
  }
  const t = bugun();
  (p.kayit[t] ||= {})[mid + "@~" + Date.now()] = { d: "ok", t: Date.now() };
  if (m.stok != null) m.stok = Math.max(0, Math.round((m.stok - (m.miktar || 1)) * 100) / 100);
  kaydet(); titret(30); toast(`${m.ad} kaydedildi`); rozetKontrol(); ciz();
}

function ilaclarCiz() {
  const p = prof();
  let h = ustBolum("İlaçlarım", `${p.ilaclar.filter(aktifIlac).length} ilaç kullanılıyor`);
  const seg = [["aktif", "Kullanılan"], ["gerekirse", "Gerektiğinde"], ["bitti", "Biten"]];
  h += `<div class="seg">${seg.map(([k, a]) => `<button class="${ui.ilacSeg === k ? "on" : ""}" onclick="ui.ilacSeg='${k}';ciz()">${a}</button>`).join("")}</div>`;
  const liste = p.ilaclar.filter(m => ui.ilacSeg === "bitti" ? !aktifIlac(m) : aktifIlac(m) && (ui.ilacSeg === "gerekirse" ? m.plan === "gerekirse" : m.plan !== "gerekirse"));
  if (!liste.length) {
    h += `<div class="empty"><div class="art">${hap(ui.ilacSeg === "gerekirse" ? "yumusak" : "kapsul", "#9AD2EE", "#F4F1EA", 70)}</div><h3>${ui.ilacSeg === "bitti" ? "Biten ilaç yok" : "Burada henüz ilaç yok"}</h3>
      <p>${ui.ilacSeg === "gerekirse" ? "Ağrı kesici gibi sadece gerektiğinde aldığın ilaçları buraya ekleyebilirsin." : ui.ilacSeg === "bitti" ? "Süresi biten veya durdurduğun ilaçlar burada görünür." : "İlaçlarını ekle, saatini ben takip edeyim."}</p>
      ${ui.ilacSeg !== "bitti" ? `<button class="btn" onclick="ilacFormu()">${ic("plus", 20)} İlaç ekle</button>` : ""}</div>`;
    return h;
  }
  h += liste.map(m => {
    const kg = kalanGun(m), u = gunlukKullanim(m);
    let stok = "";
    if (m.stok != null) {
      const yuzde = u ? Math.min(100, kg / 30 * 100) : Math.min(100, m.stok / 30 * 100);
      const dusuk = m.stok <= 0 || (kg != null && kg <= (m.uyariGun || 5));
      stok = `<div class="stock"><div class="bar ${dusuk ? "low" : ""}"><i style="width:${Math.max(4, yuzde)}%"></i></div><span class="${dusuk ? "low" : ""}">${m.stok <= 0 ? "Bitti" : kg != null ? `${kg} gün yeter` : `${sayiYaz(m.stok)} ${esc(m.birim)}`}</span></div>`;
    }
    const durumYaz = m.durdu ? "Durduruldu" : m.bitis && m.bitis < bugun() ? "Süresi bitti" : m.bitis ? `${tarihYaz(m.bitis)} tarihine kadar` : "";
    return `<div class="medc" onclick="ilacDetay('${m.id}')"><div class="mp">${hap(m.form, m.renk1, m.renk2, 58)}</div>
      <div class="mb"><div class="mn">${esc(m.ad)} <span>${esc(m.guc || "")}</span></div>
      <div class="ms">${esc(miktarYaz(m))} · ${esc(planYaz(m))}</div>
      <div class="ms" style="color:var(--muted)">${m.plan === "gerekirse" ? (m.minAra ? `En az ${m.minAra} saat ara` : "") : esc(m.saatler.join("  ·  "))}${durumYaz ? " · " + durumYaz : ""}</div>${stok}</div>
      <span class="chev">${ic("chevR", 20)}</span></div>`;
  }).join("");
  return h;
}

function aiHtml(b) {

  return `<div class="ai"><h4>${ic("spark", 18)} ${esc(b.grup || "Genel bilgi")}</h4>
    ${b.etken ? `<p><b>Etken madde:</b> ${esc(b.etken)}</p>` : ""}

}
async function ilacBilgi(id) {
  const m = prof().ilaclar.find(x => x.id === id); if (!m) return;
  $("aiBox").innerHTML = `<div class="ai"><h4>${ic("spark", 18)} Bilgiler hazırlanıyor…</h4><div class="shimmer"></div><div class="shimmer" style="width:80%"></div><div class="shimmer" style="width:60%"></div></div>`;
  try {
    const r = await fetch("/api/ilac", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ islem: "bilgi", ad: `${m.ad} ${m.guc || ""}`.trim() }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.hata || "Bilgi alınamadı");
    m.bilgi = j; kaydet();
    if ($("aiBox")) $("aiBox").innerHTML = aiHtml(j);
  } catch (e) {
    if ($("aiBox")) $("aiBox").innerHTML = `<div class="ai"><p>${esc(e.message === "Failed to fetch" ? "İnternet bağlantısı yok gibi görünüyor." : e.message)}</p><button class="btn sm soft" style="margin-top:.6rem" onclick="ilacBilgi('${id}')">Tekrar dene</button></div>`;
  }
}
function stokEkle(id) {
  const m = prof().ilaclar.find(x => x.id === id); if (!m) return;
  const v = prompt(`${m.ad}: Kaç ${m.birim} ekleyeyim?\n(Yeni kutudaki miktarı yaz, örn. 28)`, m.sonKutu || "");
  if (v == null) return;
  const n = parseFloat(String(v).replace(",", "."));
  if (!(n > 0)) { toast("Geçerli bir sayı yaz"); return; }
  m.stok = Math.round(((m.stok || 0) + n) * 100) / 100; m.sonKutu = n; kaydet();
  toast(`${sayiYaz(n)} ${m.birim} eklendi · toplam ${sayiYaz(m.stok)}`);
  sheetKapat(true); ciz();
}
function ilacDurdur(id) {

  kaydet(); sheetKapat(true); ciz();
}
function ilacSil(id) {
  const p = prof(), m = p.ilaclar.find(x => x.id === id); if (!m) return;
  if (!confirm(`“${m.ad}” ve geçmiş kayıtları silinsin mi?\n\nSadece kullanmayı bıraktıysan “Durdur” daha iyi olur, geçmişin korunur.`)) return;
  p.ilaclar = p.ilaclar.filter(x => x.id !== id); kaydet(); sheetKapat(true); ciz(); toast("İlaç silindi");

function formCiz() { onizle(); formSecCiz(); renkCiz(); planCiz(); saatCiz(); nasilCiz(); sureCiz(); uyariCiz(); $("fMik").textContent = sayiYaz(F.miktar); }

function formSec(k) {
  const eski = FORMLAR.find(x => x.k === F.form), yeni = FORMLAR.find(x => x.k === k);

  if (eski.k === "surup" && k !== "surup" && F.miktar === 5) F.miktar = 1;
  F.form = k; $("fMik").textContent = sayiYaz(F.miktar); formSecCiz(); renkCiz(); onizle();

function renkCiz() {

function miktar(y) {

  $("fMik").textContent = sayiYaz(F.miktar); onizle();

function planCiz() {

function fotoTara() { const i = $("fotoInp"); i.value = ""; i.onchange = () => i.files[0] && fotoIsle(i.files[0]); i.click(); }
async function fotoKucult(file, max = 1280) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, no) => { const x = new Image(); x.onload = () => ok(x); x.onerror = no; x.src = url; });
    const o = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement("canvas"); c.width = Math.round(img.width * o); c.height = Math.round(img.height * o);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", .85);
  } finally { URL.revokeObjectURL(url); }
}
async function fotoIsle(file) {
  $("scanT").textContent = "Kutuyu okuyorum…"; $("scanS").textContent = "Birkaç saniye sürebilir";
  try {
    const resim = await fotoKucult(file);
    const r = await fetch("/api/ilac", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ islem: "tara", resim }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.hata || "Okunamadı");
    if (!j.bulundu) throw new Error("Kutunun üzerindeki yazıyı okuyamadım. Daha yakından ve aydınlık bir yerde tekrar dene.");
    F.ad = j.ad; $("fAd").value = j.ad;
    if (j.guc) { F.guc = j.guc; $("fGuc").value = j.guc; }
    if (j.form) formSec(j.form);
    if (j.adet) { F.stok = j.adet; $("fStok").value = j.adet; }
    onizle();
    $("scanT").textContent = "Okundu ✓ Bilgileri kontrol et"; $("scanS").textContent = j.etken ? "Etken madde: " + j.etken : "Saatleri ve dozu sen seç";
    titret(30);
  } catch (e) {
    $("scanT").textContent = "Tekrar dene"; $("scanS").textContent = e.message === "Failed to fetch" ? "İnternet bağlantısı yok gibi görünüyor" : e.message;
  }
}

function olcumDeger(o) { return o.tur === "tansiyon" ? `${o.d1}/${o.d2}` : sayiYaz(o.d1); }
function olcumYorum(o) {

    case "seker": return v < 70 ? ["Düşük", "t-late"] : (o.baglam === "Aç" ? (v >= 126 ? ["Yüksek", "t-late"] : v > 100 ? ["Sınırda", "t-now"] : ["Normal", "t-ok"]) : (v >= 200 ? ["Yüksek", "t-late"] : v >= 140 ? ["Sınırda", "t-now"] : ["Normal", "t-ok"]));
    case "nabiz": return v > 100 ? ["Yüksek", "t-now"] : v < 50 ? ["Düşük", "t-now"] : ["Normal", "t-ok"];
    case "ates": return v >= 38.5 ? ["Ateş", "t-late"] : v >= 37.5 ? ["Hafif", "t-now"] : v < 35.5 ? ["Düşük", "t-now"] : ["Normal", "t-ok"];

function zamanOnce(t) {

}
function spark(v, renk) {

  const pts = v.map((x, i) => [i / (v.length - 1) * 116 + 2, 24 - (x - mn) / r * 20 + 0]);
  const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  return `<path d="${d} L118 28 L2 28Z" fill="${renk}" opacity=".1"/><path d="${d}" fill="none" stroke="${renk}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
}
function cizgiGrafik(l, o) {

  const vals = l.flatMap(x => o.iki ? [x.d1, x.d2] : [x.d1]);
  let mn = Math.min(...vals), mx = Math.max(...vals); const pad = (mx - mn) * .15 || 2; mn -= pad; mx += pad;
  const X = i => pl + i / (l.length - 1) * (W - pl - pr), Y = v => pt + (1 - (v - mn) / (mx - mn)) * (H - pt - pb);
  const line = (k, c) => { const d = l.map((x, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(x[k]).toFixed(1)).join(" ");
    return `<path d="${d} L${X(l.length - 1)} ${H - pb} L${pl} ${H - pb}Z" fill="${c}" opacity=".08"/><path d="${d}" fill="none" stroke="${c}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>` + l.map((x, i) => `<circle cx="${X(i)}" cy="${Y(x[k])}" r="3.2" fill="var(--card)" stroke="${c}" stroke-width="2"/>`).join(""); };
  let grid = "";
  for (let i = 0; i <= 3; i++) { const v = mn + (mx - mn) * i / 3, y = Y(v); grid += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" stroke="var(--line2)"/><text x="${pl - 5}" y="${y + 3}" text-anchor="end" font-size="9" fill="var(--muted)">${Math.round(v * 10) / 10}</text>`; }

  const c = $("confetti"), x = c.getContext("2d");
  c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio; x.scale(devicePixelRatio, devicePixelRatio);
  const renk = ["#F1DBA8", "#C9A256", "#93A9EC", "#FFFFFF", "#E8A87C", "#3A4C8A"];
  const parca = Array.from({ length: 110 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 80, y: innerHeight * .35, vx: (Math.random() - .5) * 12, vy: -Math.random() * 12 - 4, r: Math.random() * 6 + 3, a: Math.random() * 6, va: (Math.random() - .5) * .3, c: renk[Math.floor(Math.random() * renk.length)] }));
  let k = 0;
  (function kare() {
    x.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of parca) { p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
      x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.globalAlpha = Math.max(0, 1 - k / 120); x.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); x.restore(); }
    if (++k < 120) requestAnimationFrame(kare); else x.clearRect(0, 0, innerWidth, innerHeight);
  })();
}

// ---------- Ses ve bildirim ----------
let sesCtx;
function sesHazir() { try { sesCtx ||= new (window.AudioContext || window.webkitAudioContext)(); if (sesCtx.state === "suspended") sesCtx.resume(); } catch {} }
document.addEventListener("pointerdown", sesHazir, { passive: true });
function zil(zorla) {
  if (!S.ayar.ses && !zorla) return;
  try {
    sesHazir(); const t0 = sesCtx.currentTime;
    const nota = (f, t, sure = .9, tip = "sine", ses = .22) => {
      const o = sesCtx.createOscillator(), g = sesCtx.createGain();
      o.type = tip; o.frequency.value = f;
      g.gain.setValueAtTime(0, t0 + t); g.gain.linearRampToValueAtTime(ses, t0 + t + .015); g.gain.exponentialRampToValueAtTime(.0008, t0 + t + sure);
      o.connect(g).connect(sesCtx.destination); o.start(t0 + t); o.stop(t0 + t + sure + .05);
      if (tip === "sine") { const o2 = sesCtx.createOscillator(), g2 = sesCtx.createGain(); o2.frequency.value = f * 2.01; g2.gain.setValueAtTime(0, t0 + t); g2.gain.linearRampToValueAtTime(ses * .25, t0 + t + .01); g2.gain.exponentialRampToValueAtTime(.0005, t0 + t + sure * .6); o2.connect(g2).connect(sesCtx.destination); o2.start(t0 + t); o2.stop(t0 + t + sure); }
    };
    if (S.ayar.zil === "yumusak") [[523, 0], [659, 0], [784, 0], [659, .8], [784, .8], [1047, .8]].forEach(([f, t]) => nota(f, t, 1.6, "sine", .1));
    else if (S.ayar.zil === "klasik") [0, .22, .44, 1.1, 1.32, 1.54].forEach(t => nota(988, t, .16, "square", .06));
    else [[1319, 0], [1568, .14], [1976, .28], [2637, .42], [1976, 1.1], [2637, 1.24]].forEach(([f, t]) => nota(f, t, 1.1));
  } catch {}
}
async function bildirimIzni() {
  if (!("Notification" in window)) { toast("iPhone'da önce Paylaş → Ana Ekrana Ekle, sonra oradan aç"); return; }
  try { await Notification.requestPermission(); } catch {}
  if (Notification.permission === "granted") toast("Bildirimler açık 🔔");
  if (yigin.length) { sheetKapat(true); ayarlarAc(); } else ciz();
}
async function bildirimGonder(baslik, govde, tag, veri) {
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  const o = { body: govde, icon: "/ilac/icon-192.png", badge: "/ilac/icon-192.png", tag, renotify: true, requireInteraction: true, vibrate: [300, 150, 300, 150, 300], data: veri || {} };
  if (veri && veri.dozlar) o.actions = [{ action: "aldim", title: "✓ Aldım" }, { action: "ertele", title: "10 dk ertele" }];
  try {
    const reg = await navigator.serviceWorker?.getRegistration("/ilac/");
    if (reg) return await reg.showNotification(baslik, o);
    delete o.actions; new Notification(baslik, o);
  } catch {}
}

// ---------- Hatırlatma ekranı ----------
let aktifAlarm = [], alarmSes;
function alarmGoster(liste) {
  liste.sort((a, b) => a.saat.localeCompare(b.saat));
  aktifAlarm = liste;
  $("alarmEl")?.remove();
  const ilk = liste[0], cok = S.profiller.length > 1;
  const d = document.createElement("div"); d.className = "alarm"; d.id = "alarmEl";
  d.innerHTML = `<div class="rings"><i></i><i></i><i></i><div class="core">${hap(ilk.m.form, ilk.m.renk1, ilk.m.renk2, 92)}</div></div>
    <div class="eyebrow">İlaç zamanı</div><div class="big">${esc(ilk.saat)}</div>
    <div class="al">${liste.map(x => `<div>${hap(x.m.form, x.m.renk1, x.m.renk2, 40)}<span><b>${esc(x.m.ad)} ${esc(x.m.guc || "")}</b><small>${esc(x.saat)} · ${esc(miktarYaz(x.m))}${x.m.nasil !== NASIL[0] ? " · " + esc(x.m.nasil) : ""}${cok ? " · " + esc(prof(x.pid).ad) : ""}</small></span></div>`).join("")}</div>
    <div class="acts"><button class="btn gold" onclick="alarmAldim()">${ic("check", 22, 2.6)} Aldım</button>
      <button class="btn line" onclick="alarmErtele()">${ic("clock", 20)} 10 dakika sonra hatırlat</button>
      <button class="btn line" style="background:none;border:0" onclick="alarmAtla()">Bu sefer atla</button></div>`;
  document.body.appendChild(d);
  zil(); titret([400, 200, 400, 200, 400]);
  clearInterval(alarmSes); let n = 0;
  alarmSes = setInterval(() => { if (++n > 8 || !$("alarmEl")) return clearInterval(alarmSes); zil(); titret([300, 150, 300]); }, 5000);
}
function alarmKapat() { clearInterval(alarmSes); $("alarmEl")?.remove(); aktifAlarm = []; }
function alarmAldim() { const g = bugun(); aktifAlarm.forEach(x => !x.deneme && al(x.pid, x.key, g, true)); alarmKapat(); toast("Aferin, kendine iyi bakıyorsun 👏"); ciz(); }
function alarmAtla() { const g = bugun(); aktifAlarm.forEach(x => !x.deneme && atla(x.pid, x.key, g)); alarmKapat(); ciz(); }
function alarmErtele() { const g = bugun(); aktifAlarm.forEach(x => { if (!x.deneme) S.ertele[g + "|" + x.pid + "|" + x.key] = Date.now() + 10 * 60000; }); kaydet(); alarmKapat(); toast("10 dakika sonra tekrar hatırlatacağım"); }
function denemeAlarm() {
  sheetKapat(true);
  const m = prof().ilaclar[0] || { ad: "Örnek ilaç", guc: "500 mg", miktar: 1, birim: "tablet", nasil: "Tok karnına", form: "kapsul", renk1: "#F29B4B", renk2: "#F4F1EA" };
  const saat = saatYaz(simdiDk());
  alarmGoster([{ pid: S.aktif, m, saat, key: "deneme", deneme: true }]);
  bildirimGonder(`💊 ${m.ad} zamanı`, `${saat} · ${miktarYaz(m)} (deneme)`, "ilac-deneme");
}

// Her 20 saniyede bir: saati gelen dozlar ve yaklaşan randevular
function kontrol() {
  const g = bugun(), sd = simdiDk(), simdi = Date.now();
  for (const k of Object.keys(S.haber)) if (!k.startsWith(g) && !k.startsWith("r|")) delete S.haber[k];
  for (const k of Object.keys(S.ertele)) if (!k.startsWith(g)) delete S.ertele[k];
  const vade = [];
  for (const p of S.profiller) for (const d of dozlar(p.id, g, false)) {
    if (kayitAl(d)) continue;
    const f = sd - dk(d.saat);
    if (f < 0 || f > 180) continue;
    const ek = `${g}|${p.id}|${d.key}`;
    if (S.ertele[ek]) { if (simdi >= S.ertele[ek]) { delete S.ertele[ek]; vade.push(d); } continue; }
    if (!S.haber[ek + "|1"]) { S.haber[ek + "|1"] = 1; vade.push(d); }
    else if (f >= 15 && !S.haber[ek + "|2"]) { S.haber[ek + "|2"] = 1; vade.push(d); }
  }
  let degisti = vade.length > 0;
  if (vade.length) {
    const yeni = vade.filter(x => !aktifAlarm.some(a => a.key === x.key && a.pid === x.pid));
    if (yeni.length) {
      alarmGoster([...aktifAlarm.filter(a => !a.deneme), ...yeni]);
      const cok = S.profiller.length > 1;
      bildirimGonder(yeni.length === 1 ? `💊 ${yeni[0].m.ad} zamanı` : `💊 ${yeni.length} ilacın zamanı geldi`,
        yeni.map(x => `${x.saat} · ${x.m.ad} ${x.m.guc || ""} — ${miktarYaz(x.m)}${x.m.nasil !== NASIL[0] ? " (" + x.m.nasil + ")" : ""}${cok ? " · " + prof(x.pid).ad : ""}`).join("\n"),
        "ilac-" + g + "-" + yeni.map(x => x.key).join(","), { dozlar: yeni.map(x => [x.pid, x.key]), gun: g });
    }
  }
  // Randevular: 1 gün ve 1 saat önce
  for (const p of S.profiller) for (const r of p.randevular) {
    const f = (new Date(r.t) - simdi) / 60000;
    for (const [es, ad] of [[1440, "1g"], [60, "1s"]]) {
      if (f > 0 && f <= es && !S.haber[`r|${r.id}|${ad}`]) {
        S.haber[`r|${r.id}|${ad}`] = 1; degisti = true;
        bildirimGonder(`🩺 ${ad === "1g" ? "Yarın" : "Birazdan"} randevun var`, `${randevuZaman(r)} · ${r.doktor || r.bolum}${r.yer ? " · " + r.yer : ""}`, "r-" + r.id);
        if (ad === "1s" || f < 180) toast(`🩺 ${r.doktor || r.bolum}: ${randevuZaman(r)}`);
        break;
      }
    }
  }
  if (degisti) kaydet();
  if (ui.tab === "bugun" && !yigin.length) ciz();
}

// ---------- Takvim, yedek, yükleme ----------
function takvimeEkle() {
  const m = [], r = [];
  for (const p of S.profiller) {
    const on = S.profiller.length > 1 ? p.ad + ": " : "";
    for (const x of p.ilaclar.filter(x => aktifIlac(x) && x.plan !== "gerekirse"))
      m.push({ a: on + x.ad + (x.guc ? " " + x.guc : ""), d: miktarYaz(x), n: x.nasil !== NASIL[0] ? x.nasil : "", s: x.saatler, g: x.plan === "gunler" ? x.gunler : null, r: x.plan === "aralik" ? x.aralik : 0, bs: x.baslangic, b: x.bitis || "", i: x.id });
    for (const x of p.randevular.filter(x => new Date(x.t) > Date.now()))
      r.push({ b: on + [x.doktor, x.bolum].filter(Boolean).join(" · "), y: x.yer, t: x.t, i: x.id });
  }
  if (!m.length && !r.length) { toast("Önce bir ilaç veya randevu ekle"); return; }
  const b64 = btoa(unescape(encodeURIComponent(JSON.stringify({ m, r })))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  S.ayar.takvimVar = true; kaydet();
  location.href = "/api/takvim?v=" + b64;
}
function yedekIndir() {
  const blob = new Blob([JSON.stringify({ uygulama: "ilac-saatim", surum: 2, veri: S }, null, 1)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `ilac-saatim-yedek-${bugun()}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  toast("Yedek indirildi");
}
$("yedekInp").onchange = function () {
  const f = this.files[0]; this.value = ""; if (!f) return;
  f.text().then(t => {
    const v = JSON.parse(t);
    let yeni;
    if (v.uygulama === "ilac-saatim" && v.surum === 2 && v.veri?.profiller) yeni = v.veri;
    else if (v.uygulama === "ilac-saatim" && Array.isArray(v.ilaclar)) { localStorage.setItem("is_ilaclar", JSON.stringify(v.ilaclar)); localStorage.setItem("is_kayit", JSON.stringify(v.kayit || {})); localStorage.removeItem(ANAHTAR); yeni = yukleVeri(); }
    else throw 0;
    if (!confirm(`Yedekte ${yeni.profiller.length} kişi ve ${yeni.profiller.reduce((s, p) => s + p.ilaclar.length, 0)} ilaç var. Şimdiki bilgilerin yerine yüklensin mi?`)) return;
    S = yeni; kaydet(); sheetKapat(true); ciz(); toast("Yedek yüklendi ✓");
  }).catch(() => toast("Bu dosya bir İlaç Saatim yedeği değil"));
};
let kurulum = null;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); kurulum = e; });
async function yukle() { if (!kurulum) return; kurulum.prompt(); await kurulum.userChoice; kurulum = null; sheetKapat(true); }

// ---------- Karşılama ----------
function karsilama() {
  const d = document.createElement("div"); d.className = "onb"; d.id = "onb";
  d.innerHTML = `<div class="art">
      <div class="p" style="left:2%;top:4%;animation-delay:-1s">${hap("kapsul", "#E9CFA4", "#1E2A55", 84)}</div>
      <div class="p" style="right:3%;top:2%;animation-delay:-3s">${hap("tablet", "#F4F1EA", null, 64)}</div>
      <div class="p" style="right:2%;bottom:0;animation-delay:-2s">${hap("yumusak", "#E3C27F", null, 72)}</div>
      <div class="p" style="left:4%;bottom:2%;animation-delay:-4s">${hap("oval", "#9FB4EA", null, 60)}</div>
      <img src="/ilac/icon-512.png" alt="İlaç Saatim" style="width:9.5rem;height:9.5rem;position:relative;filter:drop-shadow(0 24px 40px rgba(0,0,0,.55)) drop-shadow(0 0 30px rgba(120,150,230,.25))">
    </div>
    <div style="max-width:520px;margin:0 auto;width:100%">
      <h1>İlaçların <em>tam zamanında</em>, aklın rahat.</h1>
      <p>İlaçlarını, ölçümlerini ve doktor randevularını zarif ve tek bir yerde takip et.</p>
      <ul><li>${ic("bell", 20)} Saati gelince nazik hatırlatma</li><li>${ic("camera", 20)} Kutunun fotoğrafından otomatik bilgi</li><li>${ic("users", 20)} Ailen için ayrı listeler</li><li>${ic("shield", 20)} Bilgilerin sadece telefonunda</li></ul>
      <input class="inp" id="onbAd" maxlength="20" placeholder="Adın (isteğe bağlı)" autocomplete="given-name">
      <button class="btn gold" onclick="karsilamaBitti()">Başlayalım ${ic("chevR", 20, 2.4)}</button></div>`;
  document.body.appendChild(d);
}
function karsilamaBitti() {
  S.ayar.isim = ($("onbAd").value || "").trim().slice(0, 20); S.ayar.hosgeldin = true; kaydet();
  $("onb").style.transition = ".4s"; $("onb").style.opacity = "0"; setTimeout(() => $("onb")?.remove(), 400);
  ciz(); sesHazir();
}

// ---------- Başlangıç ----------
const TABS = { bugun: ["home", "Bugün"], ilaclar: ["pill", "İlaçlar"], saglik: ["heart", "Sağlık"], rapor: ["chart", "Rapor"] };
document.querySelectorAll(".tabbar .tb").forEach(b => {
  const [i, a] = TABS[b.dataset.t]; b.innerHTML = ic(i, 23) + a;
  b.onclick = () => { ui.tab = b.dataset.t; if (b.dataset.t === "bugun") ui.gun = bugun(); ciz(); scrollTo({ top: 0, behavior: "smooth" }); };
});
document.querySelector(".fab").innerHTML = ic("plus", 28, 2.4);

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/ilac/sw.js", { scope: "/ilac/" }).catch(() => {});
  navigator.serviceWorker.addEventListener("message", e => {
    const v = e.data || {};
    if (v.tip === "aldim" && Array.isArray(v.dozlar)) { v.dozlar.forEach(([pid, key]) => S.profiller.some(p => p.id === pid) && !kayitAl({ pid, key, gun: v.gun }) && al(pid, key, v.gun, true)); alarmKapat(); ciz(); toast("Kaydedildi ✓"); }
    else if (v.tip === "ertele" && Array.isArray(v.dozlar)) { v.dozlar.forEach(([pid, key]) => S.ertele[v.gun + "|" + pid + "|" + key] = Date.now() + 10 * 60000); kaydet(); alarmKapat(); }
    else kontrol();
  });
}
// Bildirimdeki düğmeyle açıldıysa
(function () {
  const q = new URLSearchParams(location.search);
  if (q.get("islem") && q.get("d")) {
    try {
      const dz = JSON.parse(q.get("d")), g = q.get("gun");
      if (q.get("islem") === "aldim") { dz.forEach(([pid, key]) => S.profiller.some(p => p.id === pid) && !kayitAl({ pid, key, gun: g }) && al(pid, key, g, true)); setTimeout(() => toast("Kaydedildi ✓"), 400); }
      if (q.get("islem") === "ertele") { dz.forEach(([pid, key]) => S.ertele[g + "|" + pid + "|" + key] = Date.now() + 10 * 60000); kaydet(); setTimeout(() => toast("10 dakika sonra tekrar hatırlatacağım"), 400); }
    } catch {}
    history.replaceState(null, "", "/ilac/");
  }
  const kisa = q.get("ekle");
  if (kisa) { history.replaceState(null, "", "/ilac/"); setTimeout(() => kisa === "olcum" ? olcumFormu() : ilacFormu(), 300); }
})();

ciz();
if (!S.ayar.hosgeldin) karsilama();
kontrol();
setInterval(kontrol, 20000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { if (ui.gun !== bugun() && ui.tab === "bugun") ui.gun = bugun(); kontrol(); if (!yigin.length) ciz(); } });
</script>
