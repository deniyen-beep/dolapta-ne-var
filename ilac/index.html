<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MediTime · İlaçlarını Unutma</title>
<meta name="description" content="İlaçlarını, ölçümlerini ve doktor randevularını tek yerde takip et. Saati gelince hatırlatsın.">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MediTime">
<link rel="apple-touch-icon" sizes="180x180" href="/ilac/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/ilac/icon-192.png">
<link rel="manifest" href="/ilac/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400;1,6..96,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ============ MediTime · "Atelier" — beyaz, editoryal, lüks ============ */
:root{
  --bg:#FFFFFF; --paper:#FAF8F4; --sheet:#FFFFFF; --nav:rgba(255,255,255,.96);
  --card:#FFFFFF; --card2:#FAF8F4; --field:#FFFFFF;
  --line:#E6E1D6; --line2:#F0ECE4;
  --ink:#0E1220; --ink2:#41475A; --muted:#8C877B;
  --em:#1B2550; --em2:#46558F; --em-soft:#F1F3F8;
  --gold:#A98450; --gold2:#D8C3A1; --gold-deep:#8A6A3D; --gold-soft:#F7F2E9;
  --ok:#2E6A4E; --ok-soft:#EEF5F0; --warn:#986A1E; --warn-soft:#FBF4E5; --bad:#9B2C3B; --bad-soft:#FBEFF0;
  --shadow:0 1px 2px rgba(14,18,32,.035),0 14px 34px -22px rgba(14,18,32,.22);
  --scrim:rgba(14,18,32,.34);
  --serif:"Bodoni Moda",Didot,"Times New Roman",serif; --sans:Jost,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
:root[data-tema="koyu"]{
  --bg:#0C0F19; --paper:#11141F; --sheet:#11141F; --nav:rgba(12,15,25,.96);
  --card:#121624; --card2:#151A29; --field:#121624;
  --line:#262B3A; --line2:#1C2130;
  --ink:#F3EFE7; --ink2:#C6C2BA; --muted:#8E8A80;
  --em:#C9D1EE; --em2:#9AA6D6; --em-soft:#1A2034;
  --gold:#CBAA78; --gold2:#7E6A4A; --gold-deep:#D9BC8E; --gold-soft:#1E1C1A;
  --ok:#86C9A6; --ok-soft:#14231C; --warn:#E3B566; --warn-soft:#262014; --bad:#E08A95; --bad-soft:#2A161A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px -22px rgba(0,0,0,.8);
  --scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root[data-tema="oto"]{
    --bg:#0C0F19; --paper:#11141F; --sheet:#11141F; --nav:rgba(12,15,25,.96);
    --card:#121624; --card2:#151A29; --field:#121624;
    --line:#262B3A; --line2:#1C2130;
    --ink:#F3EFE7; --ink2:#C6C2BA; --muted:#8E8A80;
    --em:#C9D1EE; --em2:#9AA6D6; --em-soft:#1A2034;
    --gold:#CBAA78; --gold2:#7E6A4A; --gold-deep:#D9BC8E; --gold-soft:#1E1C1A;
    --ok:#86C9A6; --ok-soft:#14231C; --warn:#E3B566; --warn-soft:#262014; --bad:#E08A95; --bad-soft:#2A161A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px -22px rgba(0,0,0,.8);
    --scrim:rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px;background:var(--bg)}
html.buyuk{font-size:18.5px}
body{font-family:var(--sans);font-weight:400;color:var(--ink);min-height:100vh;line-height:1.5;background:var(--bg);
  padding:env(safe-area-inset-top) 0 calc(7rem + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
.serif{font-family:var(--serif)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:580px;margin:0 auto;padding:0 1.25rem}
.i{display:block;flex:0 0 auto}
[hidden]{display:none!important}
.muted{color:var(--muted)}
.gt{font-style:italic}
.caps{font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;font-weight:500;color:var(--muted)}

/* Üst bölüm */
.brandbar{display:flex;align-items:center;gap:.7rem;padding:1.1rem 0 .4rem;border-bottom:1px solid var(--line2)}
.brandbar img{width:1.9rem;height:1.9rem;border-radius:.5rem;box-shadow:0 4px 10px -4px rgba(14,18,32,.35)}
.brandbar .wm{font-weight:500;font-size:.74rem;letter-spacing:.42em;color:var(--ink)}
.brandbar .wm b{font-weight:500}
.brandbar .sp{flex:1}
.top{padding:1.5rem 0 .4rem}
.avatar{width:2.4rem;height:2.4rem;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:500;font-size:1.05rem;color:#fff;flex:0 0 auto;position:relative;
  box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--gold2)}
.avatar small{position:absolute;right:-4px;bottom:-4px;width:1.05rem;height:1.05rem;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--sans);font-size:.58rem;font-weight:600;box-shadow:0 0 0 2px var(--bg)}
.hello{flex:1;min-width:0}
.hello .eyebrow{font-size:.68rem;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);font-weight:500}
.hello h1{font-family:var(--serif);font-weight:400;font-size:2.3rem;letter-spacing:-.01em;line-height:1.08;margin-top:.45rem;overflow-wrap:anywhere}
.hello h1 b{font-weight:400;font-style:italic;color:var(--em)}
.iconbtn{width:2.4rem;height:2.4rem;border-radius:50%;display:grid;place-items:center;color:var(--ink2);flex:0 0 auto;border:1px solid var(--line)}

/* Hafta şeridi */
.week{display:flex;align-items:center;gap:.1rem;margin:1.2rem 0 1.1rem;padding:.2rem 0;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.week .nav{width:1.6rem;height:4rem;display:grid;place-items:center;color:var(--muted)}
.days{flex:1;display:grid;grid-template-columns:repeat(7,1fr)}
.day{display:flex;flex-direction:column;align-items:center;gap:.25rem;padding:.55rem 0 .5rem;position:relative}
.day .dn{font-size:.6rem;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.16em}
.day .dr{position:relative;width:2.2rem;height:2.2rem;display:grid;place-items:center;border-radius:50%;transition:.25s}
.day .dr b{font-family:var(--serif);font-size:1.12rem;font-weight:400;position:relative}
.day .dot{width:4px;height:4px;border-radius:50%;background:transparent}
.day .dot.tam{background:var(--gold)} .day .dot.yarim{box-shadow:inset 0 0 0 1px var(--em2)}
.day.sel .dr{background:var(--ink)} .day.sel .dr b{color:var(--bg)} .day.sel .dn{color:var(--ink)}
.day.today:not(.sel) .dr{box-shadow:inset 0 0 0 1px var(--gold)}

/* Saat kadranı kartı */
.hero{position:relative;border:1px solid var(--line);border-radius:22px;padding:1.4rem 1.2rem 0;margin-bottom:1.4rem;background:linear-gradient(180deg,var(--paper),var(--bg) 70%);box-shadow:var(--shadow);overflow:hidden}
.hero .eyebrow{font-size:.64rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:center}
.dialw{position:relative;width:min(78vw,18.5rem);aspect-ratio:1;margin:.9rem auto .3rem}
.dial{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 18px 24px rgba(14,18,32,.14)) drop-shadow(0 2px 3px rgba(14,18,32,.10))}
.dial .pulse{animation:nabiz 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes nabiz{from{transform:scale(1);opacity:.7}to{transform:scale(2.4);opacity:0}}
.nextrow{display:flex;align-items:flex-end;gap:1rem;padding:1rem .2rem 1.1rem;border-top:1px solid var(--line2);margin-top:.9rem;cursor:pointer}
.nextrow .nl{flex:1;min-width:0}
.nextrow .nt-time{font-family:var(--serif);font-size:2.7rem;font-weight:400;line-height:1;margin-top:.35rem;letter-spacing:-.01em}
.nextrow .nt-name{font-size:.95rem;color:var(--ink2);margin-top:.35rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nextrow .nt-name i{font-family:var(--serif);color:var(--muted)}
.nextrow .nt-cd{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;font-weight:500;color:var(--gold-deep);padding:.45rem .8rem;border:1px solid var(--gold2);border-radius:99px;white-space:nowrap}
.nextrow .nt-cd.late{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.hero-foot{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line2);margin:0 -1.2rem}
.hero-foot span{display:flex;flex-direction:column;align-items:center;padding:.95rem .3rem 1rem;font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:500}
.hero-foot span+span{border-left:1px solid var(--line2)}
.hero-foot span b{font-family:var(--serif);font-size:1.6rem;font-weight:400;color:var(--ink);letter-spacing:0;text-transform:none;line-height:1.1;margin-bottom:.2rem}
.hero-foot span b small{font-size:.9rem;color:var(--muted)}
/* Rapor kartı */
.hero h2{font-family:var(--serif);font-weight:400;font-size:3.2rem;line-height:1;margin:.5rem 0 .4rem}
.hero h2 span{font-size:1rem;color:var(--muted);font-family:var(--sans);letter-spacing:.18em;text-transform:uppercase;margin-left:.3rem}
.hero .sub{color:var(--ink2);font-size:.92rem}
.hero-row{display:flex;align-items:center;gap:1rem;padding:.2rem .1rem 1.3rem}
.hero-row .eyebrow{text-align:left}
.ring-big{position:relative;width:7rem;height:7rem;flex:0 0 7rem;margin-left:auto}
.ring-big svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring-big .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-big .c b{font-family:var(--serif);font-size:2.3rem;font-weight:400;line-height:1}
.ring-big .c small{font-size:.56rem;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-top:.3rem;font-weight:500}

/* Bilgi satırları */
.notice{display:flex;align-items:center;gap:.9rem;padding:.95rem 0;border-bottom:1px solid var(--line2);font-size:.95rem}
.notice:first-of-type{border-top:1px solid var(--line2)}
.notice .ni{width:2.4rem;height:2.4rem;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;border:1px solid var(--line)}
.notice .nt{flex:1;min-width:0}
.notice .nt b{display:block;font-weight:500}
.notice .nt span{color:var(--muted);font-size:.86rem}
.n-warn .ni{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.n-gold .ni{color:var(--gold)}
.n-em .ni{color:var(--em)}
.pill-btn{padding:.45rem .85rem;border-radius:99px;font-size:.64rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);border:1px solid var(--ink);white-space:nowrap}

/* Bölüm başlıkları */
.sec{display:flex;align-items:baseline;gap:.7rem;margin:2rem 0 .9rem}
.sec .si{display:none}
.sec h3{font-family:var(--serif);font-weight:400;font-size:1.5rem;font-style:italic}
.sec::after{content:"";flex:1;height:1px;background:var(--line);transform:translateY(-.3rem)}
.sec .sc{order:3;font-size:.66rem;font-weight:500;color:var(--muted);letter-spacing:.2em}
.sec button.sc{color:var(--ink);border-bottom:1px solid var(--ink);padding-bottom:1px}
.title{font-family:var(--serif);font-weight:400;font-size:2.2rem;margin:1.1rem 0 .2rem}
.lead{color:var(--muted);margin-bottom:1rem}

/* Zaman çizgisi */
.tl{position:relative}
.tl::before{content:"";position:absolute;left:calc(3.4rem + .7rem + 3.5px);top:.6rem;bottom:.6rem;width:1px;background:var(--gold2)}
.tl-row{display:flex;align-items:center;gap:.7rem;margin-bottom:.7rem;position:relative}
.tl-t{width:3.4rem;flex:0 0 3.4rem;text-align:right;line-height:1.1}
.tl-t b{display:block;font-family:var(--serif);font-weight:400;font-size:1.25rem}
.tl-t small{display:block;font-size:.56rem;font-weight:500;color:var(--muted);margin-top:.3rem;letter-spacing:.16em;text-transform:uppercase}
.tl-n{width:8px;height:8px;border-radius:50%;flex:0 0 8px;background:var(--bg);box-shadow:0 0 0 1px var(--em);position:relative;z-index:1}
.st-ok .tl-n{background:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 0 4px var(--bg)}
.st-now .tl-n{background:var(--bg);box-shadow:0 0 0 1.5px var(--gold),0 0 0 5px var(--gold-soft)}
.st-late .tl-n,.st-missed .tl-n{background:var(--bad);box-shadow:0 0 0 1px var(--bad),0 0 0 4px var(--bad-soft)}
.st-skip .tl-n{box-shadow:0 0 0 1px var(--muted)}
.st-now .tl-t small{color:var(--gold-deep)} .st-late .tl-t small,.st-missed .tl-t small{color:var(--bad)} .st-ok .tl-t small{color:var(--gold-deep)}
.tl-row .dz{flex:1;min-width:0;margin-bottom:0}

/* Doz kartı */
.dz{display:flex;align-items:center;gap:.8rem;padding:.75rem .75rem .75rem .7rem;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:.7rem;position:relative;transition:transform .15s,opacity .3s;box-shadow:var(--shadow)}
.dz:active{transform:scale(.99)}
.dz-pill{width:3.1rem;height:3.1rem;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;background:var(--paper);border:1px solid var(--line2)}
.dz-info{flex:1;min-width:0}
.dz-name{font-family:var(--serif);font-weight:500;font-size:1.12rem;line-height:1.2;overflow-wrap:anywhere}
.dz-name span{font-family:var(--sans);font-weight:400;color:var(--muted);font-size:.78rem;letter-spacing:.04em}
.dz-sub{color:var(--ink2);font-size:.84rem;margin-top:.15rem}
.dz-meta{display:flex;align-items:center;gap:.4rem;margin-top:.35rem;flex-wrap:wrap}
.time{display:inline-flex;align-items:center;gap:.25rem;font-weight:500;font-size:.82rem}
.tag{font-size:.56rem;font-weight:500;padding:.22rem .55rem;border-radius:99px;letter-spacing:.18em;text-transform:uppercase;border:1px solid currentColor}
.t-ok{color:var(--ok)} .t-late{color:var(--bad)} .t-now{color:var(--warn)} .t-wait{color:var(--em2)} .t-skip,.t-missed{color:var(--muted)} .t-who{color:var(--gold-deep)}
.chk{width:2.6rem;height:2.6rem;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:transparent;flex:0 0 auto;transition:.3s;background:var(--bg)}
.chk.on{border-color:var(--ink);color:var(--bg);background:var(--ink);animation:pop .4s ease}
.chk.sk{border-style:dashed;color:var(--muted)}
.st-now .chk,.st-late .chk{border-color:var(--gold);color:var(--gold)}
.st-ok .dz{background:var(--paper);box-shadow:none}
.st-ok .dz-name{color:var(--muted)}
.st-late .dz{border-color:color-mix(in srgb,var(--bad) 30%,var(--line))}
@keyframes pop{0%{transform:scale(.75)}60%{transform:scale(1.08)}100%{transform:scale(1)}}

.empty{text-align:center;padding:2.2rem 1.2rem 1.8rem;border-radius:22px;border:1px solid var(--line);background:linear-gradient(180deg,var(--paper),var(--bg))}
.empty .art{display:flex;justify-content:center;align-items:flex-end;gap:.4rem;margin-bottom:1rem}
.empty h3{font-family:var(--serif);font-size:1.7rem;font-weight:400}
.empty p{color:var(--muted);margin:.5rem auto 1.4rem;max-width:22rem}

/* Düğmeler */
.btn{display:flex;align-items:center;justify-content:center;gap:.55rem;width:100%;padding:1.05rem 1.2rem;border-radius:99px;font-weight:500;font-size:.74rem;letter-spacing:.22em;text-transform:uppercase;
  background:var(--ink);color:var(--bg);transition:.2s}
.btn:active{transform:scale(.985)}
.btn.gold{background:var(--em);color:#fff}
:root[data-tema="koyu"] .btn.gold{background:#E9DCC4;color:#0E1220}
.btn.soft{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn.line{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent)}
.btn:disabled{opacity:.45}
.btn.sm{padding:.65rem 1rem;font-size:.62rem;width:auto}
.btns{display:flex;gap:.6rem}
.btns>*{flex:1;min-width:0}
.btns>.btn{padding-left:.6rem;padding-right:.6rem;white-space:nowrap}
input[type=date].inp,input[type=time].inp{min-width:0;width:100%;-webkit-appearance:none;appearance:none;display:block}

/* İlaçlar */
.seg{display:flex;margin-bottom:1.2rem;border-bottom:1px solid var(--line)}
.seg button{flex:1;padding:.75rem .3rem;font-weight:500;font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);position:relative}
.seg button.on{color:var(--ink)}
.seg button.on::after{content:"";position:absolute;left:25%;right:25%;bottom:-1px;height:1.5px;background:var(--ink)}
.medc{display:flex;align-items:center;gap:1rem;padding:1rem 0;border-bottom:1px solid var(--line2)}
.medc .mp{width:4.6rem;height:4.6rem;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;background:var(--paper);border:1px solid var(--line2)}
.medc .mb{flex:1;min-width:0}
.medc .mn{font-family:var(--serif);font-weight:500;font-size:1.3rem;overflow-wrap:anywhere;line-height:1.2}
.medc .mn span{font-family:var(--sans);font-weight:400;color:var(--muted);font-size:.8rem;letter-spacing:.04em}
.medc .ms{color:var(--ink2);font-size:.86rem;margin-top:.15rem}
.stock{display:flex;align-items:center;gap:.6rem;margin-top:.55rem}
.stock .bar{flex:1;height:2px;background:var(--line);overflow:hidden}
.stock .bar i{display:block;height:100%;background:var(--ink)}
.stock .bar.low i{background:var(--bad)}
.stock span{font-size:.6rem;font-weight:500;color:var(--muted);white-space:nowrap;letter-spacing:.16em;text-transform:uppercase}
.stock span.low{color:var(--bad)}
.chev{color:var(--muted)}

/* Alttan açılan pencere */
.sheet-bg{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .25s ease}
.sheet{background:var(--sheet);width:100%;max-width:580px;max-height:94vh;overflow:auto;overscroll-behavior:contain;border-radius:22px 22px 0 0;
  padding:.6rem 1.25rem calc(1.4rem + env(safe-area-inset-bottom));animation:up .35s cubic-bezier(.2,.9,.3,1);box-shadow:0 -20px 50px rgba(14,18,32,.18)}
.sheet.full{height:94vh}
.grip{width:2.4rem;height:3px;border-radius:9px;background:var(--line);margin:.25rem auto 1rem}
.sh-head{display:flex;align-items:center;gap:.6rem;margin-bottom:1.1rem;padding-bottom:.9rem;border-bottom:1px solid var(--line2)}
.sh-head h3{flex:1;font-family:var(--serif);font-weight:400;font-size:1.7rem}
.closex{width:2.3rem;height:2.3rem;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--ink2)}
@keyframes up{from{transform:translateY(50px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* Form */
.fg{padding:1.1rem 0;border-bottom:1px solid var(--line2)}
.fg>label,.lbl{display:block;font-weight:500;font-size:.62rem;letter-spacing:.26em;text-transform:uppercase;color:var(--gold-deep);margin-bottom:.75rem}
.lbl2{display:block;font-weight:400;font-size:.88rem;margin:1rem 0 .5rem;color:var(--ink2)}
.inp{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;border-radius:0;padding:.7rem .1rem;font-weight:400;font-size:1.08rem;outline:none;min-height:3rem;transition:.2s}
.inp::placeholder{color:#B6B0A3}
.inp:focus{border-bottom-color:var(--ink)}
textarea.inp{min-height:4.5rem;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:.8rem .9rem}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chips button{padding:.55rem .95rem;border-radius:99px;border:1px solid var(--line);font-weight:400;font-size:.88rem;color:var(--ink2);transition:.2s}
.chips button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.forms{display:grid;grid-template-columns:repeat(5,1fr);gap:.4rem}
.forms button{display:flex;flex-direction:column;align-items:center;gap:.15rem;padding:.5rem .1rem .5rem;border-radius:14px;border:1px solid transparent;font-size:.6rem;font-weight:500;color:var(--muted);line-height:1.2;text-align:center;letter-spacing:.04em}
.forms button.on{border-color:var(--ink);color:var(--ink);background:var(--paper)}
.colors{display:flex;flex-wrap:wrap;gap:.6rem}
.colors button{width:2.1rem;height:2.1rem;border-radius:50%;box-shadow:inset 0 -3px 6px rgba(0,0,0,.14),inset 0 2px 4px rgba(255,255,255,.65),0 0 0 1px rgba(14,18,32,.1);transition:.2s}
.colors button.on{box-shadow:inset 0 -3px 6px rgba(0,0,0,.14),inset 0 2px 4px rgba(255,255,255,.65),0 0 0 3px var(--bg),0 0 0 4px var(--ink)}
.stepper{display:flex;align-items:center;gap:.5rem}
.stepper button{width:2.9rem;height:2.9rem;border-radius:50%;border:1px solid var(--line);font-size:1.3rem;font-weight:300;color:var(--ink)}
.stepper b{min-width:3.4rem;text-align:center;font-family:var(--serif);font-size:1.9rem;font-weight:400}
.trow{display:flex;gap:.5rem;margin-bottom:.3rem;align-items:center}
.trow .inp{flex:1;font-family:var(--serif);font-size:1.4rem}
.trow button{width:2.4rem;height:2.4rem;border-radius:50%;border:1px solid var(--line);color:var(--muted);display:grid;place-items:center}
.preview{display:flex;align-items:center;gap:1.1rem;padding:1.1rem;border-radius:18px;margin-bottom:.4rem;background:var(--paper);border:1px solid var(--line2)}
.preview .pv{width:5rem;height:5rem;display:grid;place-items:center;flex:0 0 auto}
.preview b{display:block;font-family:var(--serif);font-size:1.5rem;font-weight:400;line-height:1.15;overflow-wrap:anywhere}
.preview span{color:var(--muted);font-size:.62rem;letter-spacing:.2em;text-transform:uppercase}
.scan{display:flex;align-items:center;gap:.9rem;width:100%;padding:.95rem 1rem;border-radius:16px;margin:.8rem 0 .2rem;text-align:left;border:1px solid var(--gold2);background:var(--gold-soft);color:var(--ink)}
.scan .si{width:2.5rem;height:2.5rem;border-radius:50%;display:grid;place-items:center;border:1px solid var(--gold);color:var(--gold-deep);flex:0 0 auto}
.scan b{display:block;font-family:var(--serif);font-weight:500;font-size:1.05rem;color:var(--ink)}
.scan span{font-size:.82rem;color:var(--muted)}
.hint{font-size:.8rem;color:var(--muted);margin-top:.5rem}

/* Detay */
.dhero{text-align:center;padding:1.6rem 1rem 1.4rem;border-radius:20px;margin-bottom:1rem;position:relative;overflow:hidden;background:radial-gradient(60% 45% at 50% 40%,#FFFFFF,var(--paper));border:1px solid var(--line2)}
:root[data-tema="koyu"] .dhero{background:var(--paper)}
.dhero .stage{width:8.4rem;height:8.4rem;margin:0 auto .5rem;display:grid;place-items:center;animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.dhero h2{font-family:var(--serif);font-weight:400;font-size:2.2rem;line-height:1.1;overflow-wrap:anywhere}
.dhero p{color:var(--muted);font-size:.66rem;letter-spacing:.24em;text-transform:uppercase;margin-top:.45rem}
.dchips{display:flex;justify-content:center;gap:.4rem;flex-wrap:wrap;margin-top:.9rem}
.dchips span{font-size:.7rem;padding:.3rem .75rem;border-radius:99px;border:1px solid var(--line);color:var(--ink2);background:var(--bg)}
.kv{display:flex;justify-content:space-between;gap:1rem;padding:.75rem 0;border-bottom:1px solid var(--line2);font-size:.95rem}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.kv b{font-weight:500;text-align:right}
.ai{border-radius:18px;padding:1.1rem;background:var(--paper);border:1px solid var(--line2);margin-bottom:.9rem}
.ai h4{display:flex;align-items:center;gap:.45rem;font-family:var(--serif);font-weight:500;font-size:1.05rem;margin:.85rem 0 .3rem}
.ai h4:first-child{margin-top:0}
.ai h4 .i{color:var(--gold)}
.ai ul{padding-left:1.1rem;font-size:.92rem;color:var(--ink2)}
.ai li{margin:.2rem 0}
.ai p{font-size:.92rem;color:var(--ink2)}
.ai .disc{font-size:.74rem;color:var(--muted);margin-top:.9rem;font-style:italic}
.shimmer{height:.8rem;border-radius:4px;margin:.55rem 0;background:linear-gradient(90deg,var(--line2),var(--bg),var(--line2));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

/* Sağlık */
.grid2{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line2);border-left:1px solid var(--line2)}
.tile{padding:1rem .9rem;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);text-align:left;display:flex;flex-direction:column;gap:.15rem;min-height:9.6rem;position:relative}
.tile .ti{width:2.1rem;height:2.1rem;border-radius:50%;display:grid;place-items:center;margin-bottom:.45rem;border:1px solid var(--line);color:var(--ink2)!important;background:none!important}
.tile .tn{font-size:.6rem;font-weight:500;color:var(--muted);letter-spacing:.22em;text-transform:uppercase}
.tile .tv{font-family:var(--serif);font-size:1.9rem;font-weight:400;line-height:1.1;margin-top:.15rem}
.tile .tv small{font-family:var(--sans);font-size:.68rem;color:var(--muted);margin-left:.25rem}
.tile .spark{margin-top:auto;height:26px}
.tile .tag{position:absolute;top:1rem;right:.8rem}
.appt{display:flex;gap:1rem;align-items:center;padding:1rem 0;border-bottom:1px solid var(--line2)}
.appt .ad{width:3.4rem;flex:0 0 auto;text-align:center;padding:.1rem 0;border-right:1px solid var(--line);color:var(--ink)}
.appt .ad b{display:block;font-family:var(--serif);font-size:1.9rem;line-height:1;font-weight:400}
.appt .ad small{font-size:.56rem;font-weight:500;text-transform:uppercase;letter-spacing:.24em;color:var(--gold-deep)}
.appt .ab{flex:1;min-width:0}
.appt .ab b{display:block;font-family:var(--serif);font-weight:500;font-size:1.1rem;overflow-wrap:anywhere}
.appt .ab span{display:block;font-size:.86rem;color:var(--muted)}
.appt.past{opacity:.5}
.chart{width:100%;height:auto;display:block}
.mlist .kv b small{color:var(--muted);font-weight:400}

/* Rapor */
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:1rem;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.stat{padding:1rem .5rem;text-align:center}
.stat+.stat{border-left:1px solid var(--line2)}
.stat b{display:block;font-family:var(--serif);font-size:1.9rem;font-weight:400;line-height:1.1}
.stat span{font-size:.58rem;font-weight:500;color:var(--muted);letter-spacing:.2em;text-transform:uppercase}
.card{border:1px solid var(--line);border-radius:18px;padding:1.1rem;margin-bottom:.9rem;background:var(--card)}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:.4rem}
.heat div{aspect-ratio:1;border-radius:50%;background:var(--line2);position:relative}
.heat div.t{box-shadow:0 0 0 1.5px var(--bg),0 0 0 2.5px var(--ink)}
.heat .h-head{background:none;aspect-ratio:auto;border-radius:0;font-size:.56rem;font-weight:500;color:var(--muted);text-align:center;letter-spacing:.14em;text-transform:uppercase}
.legend{display:flex;align-items:center;gap:.35rem;justify-content:flex-end;font-size:.6rem;color:var(--muted);margin-top:.8rem;letter-spacing:.14em;text-transform:uppercase}
.legend i{width:.75rem;height:.75rem;border-radius:50%;display:inline-block}
.mrow{display:flex;align-items:center;gap:.8rem;padding:.65rem 0;border-bottom:1px solid var(--line2)}
.mrow:last-child{border-bottom:0}
.mrow .mb{flex:1;min-width:0}
.mrow b{font-family:var(--serif);font-weight:500;font-size:1.02rem}
.mrow .bar{height:2px;background:var(--line);overflow:hidden;margin-top:.45rem}
.mrow .bar i{display:block;height:100%;background:var(--ink)}
.mrow em{font-style:normal;font-family:var(--serif);font-size:1.15rem}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:.2rem}
.badge{text-align:center;padding:.9rem .3rem}
.badge .md{width:3.6rem;height:3.6rem;margin:0 auto .6rem;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-size:1.05rem;font-weight:500;color:var(--gold-deep);
  background:radial-gradient(circle at 35% 30%,#FFFDF8,#F3EADB);box-shadow:inset 0 0 0 1px var(--gold2),inset 0 0 0 4px #FFFDF8,inset 0 0 0 5px var(--gold2),0 6px 14px -8px rgba(138,106,61,.6)}
:root[data-tema="koyu"] .badge .md{background:radial-gradient(circle at 35% 30%,#2A2620,#1A1814);box-shadow:inset 0 0 0 1px var(--gold2),inset 0 0 0 4px #1A1814,inset 0 0 0 5px var(--gold2)}
.badge b{display:block;font-family:var(--serif);font-size:.92rem;font-weight:500;line-height:1.2}
.badge span{display:block;font-size:.7rem;color:var(--muted);margin-top:.2rem;line-height:1.3}
.badge.lock .md{color:#BDB6A8;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);filter:none}
.badge.lock b{color:var(--muted)}

/* Ayarlar */
.set{display:flex;align-items:center;gap:.9rem;padding:.9rem 0;border-bottom:1px solid var(--line2)}
.set:last-child{border-bottom:0}
.set .sic{width:2.3rem;height:2.3rem;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--ink2);flex:0 0 auto}
.set .st{flex:1;min-width:0}
.set .st b{display:block;font-weight:500}
.set .st small{color:var(--muted);font-size:.82rem}
.sw{width:3.1rem;height:1.8rem;border-radius:99px;background:var(--line);position:relative;flex:0 0 auto;transition:.25s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:1.4rem;height:1.4rem;border-radius:50%;background:#fff;transition:.25s;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.sw.on{background:var(--ink)}
.sw.on::after{left:calc(100% - 1.4rem - 3px)}
.prof{display:flex;align-items:center;gap:.9rem;padding:.85rem .2rem;border-bottom:1px solid var(--line2);width:100%;text-align:left}
.prof .avatar{width:2.5rem;height:2.5rem}
.prof .pb{flex:1}
.prof .pb b{display:block;font-family:var(--serif);font-weight:500;font-size:1.1rem}
.prof .pb small{color:var(--muted)}

/* Alt menü */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:1fr 1fr 4.8rem 1fr 1fr;align-items:center;
  padding:.45rem max(.6rem,calc(50% - 290px)) calc(.45rem + env(safe-area-inset-bottom));background:var(--nav);border-top:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tabbar .tb{display:flex;flex-direction:column;align-items:center;gap:.25rem;padding:.4rem 0;font-size:.56rem;font-weight:500;color:var(--muted);letter-spacing:.2em;text-transform:uppercase;position:relative}
.tabbar .tb .i{stroke-width:1.4}
.tabbar .tb.on{color:var(--ink)}
.tabbar .tb.on::before{content:"";position:absolute;top:-.46rem;left:30%;right:30%;height:1.5px;background:var(--ink)}
.fab{width:3.5rem;height:3.5rem;border-radius:50%;margin:-1.5rem auto 0;display:grid;place-items:center;color:#fff;background:var(--em);
  box-shadow:0 0 0 4px var(--bg),0 0 0 5px var(--gold2),0 12px 24px -10px rgba(27,37,80,.6);transition:.2s}
:root[data-tema="koyu"] .fab{background:#E9DCC4;color:#0E1220}
.fab:active{transform:scale(.95)}
.menu{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line2);border-left:1px solid var(--line2)}
.menu button{display:flex;flex-direction:column;align-items:flex-start;gap:.5rem;padding:1.1rem 1rem;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);text-align:left}
.menu button .mi{width:2.4rem;height:2.4rem;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--ink)!important;background:none!important}
.menu button b{font-family:var(--serif);font-weight:500;font-size:1.15rem}
.menu button span{font-size:.8rem;color:var(--muted);line-height:1.35}

/* Hatırlatma ekranı */
.alarm{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(1.5rem + env(safe-area-inset-top)) 1.4rem calc(1.5rem + env(safe-area-inset-bottom));color:var(--ink);text-align:center;
  background:radial-gradient(70% 45% at 50% 30%,#FFFFFF,#F6F2EA);animation:fade .4s ease;overflow:auto}
:root[data-tema="koyu"] .alarm{background:var(--bg)}
.alarm .rings{position:relative;width:10.5rem;height:10.5rem;display:grid;place-items:center;margin-bottom:1.3rem;flex:0 0 auto}
.alarm .rings i{position:absolute;inset:0;border-radius:50%;border:1px solid var(--gold2);animation:ripple 3s ease-out infinite}
.alarm .rings i:nth-child(2){animation-delay:1s} .alarm .rings i:nth-child(3){animation-delay:2s}
@keyframes ripple{from{transform:scale(.7);opacity:1}to{transform:scale(1.35);opacity:0}}
.alarm .rings .core{width:7.4rem;height:7.4rem;border-radius:50%;display:grid;place-items:center;background:var(--bg);box-shadow:0 0 0 1px var(--line),0 18px 36px -16px rgba(14,18,32,.35);animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.alarm .eyebrow{font-size:.66rem;letter-spacing:.36em;text-transform:uppercase;color:var(--gold-deep);font-weight:500}
.alarm .big{font-family:var(--serif);font-size:5.2rem;font-weight:400;line-height:1;margin:.5rem 0 .2rem}
.alarm .al{width:100%;max-width:400px;margin:1.1rem 0 1.4rem;border-top:1px solid var(--line)}
.alarm .al div{display:flex;align-items:center;gap:.8rem;padding:.8rem .2rem;border-bottom:1px solid var(--line);text-align:left}
.alarm .al b{display:block;font-family:var(--serif);font-weight:500;font-size:1.15rem}
.alarm .al small{display:block;color:var(--muted);font-size:.84rem}
.alarm .acts{width:100%;max-width:400px;display:flex;flex-direction:column;gap:.6rem}

/* Açılış ve karşılama */
.onb{position:fixed;inset:0;z-index:95;display:flex;flex-direction:column;color:#0E1220;overflow:auto;background:#FFFFFF;
  padding:calc(1.4rem + env(safe-area-inset-top)) 1.5rem calc(1.6rem + env(safe-area-inset-bottom))}
.onb .ob{display:flex;align-items:center;gap:.7rem;padding-bottom:1rem;border-bottom:1px solid #EFEBE3}
.onb .ob img{width:1.8rem;height:1.8rem;border-radius:.45rem}
.onb .ob span{font-size:.7rem;letter-spacing:.42em;font-weight:500}
.onb .ob em{margin-left:auto;font-family:var(--serif);font-size:.8rem;color:#8C877B}
.onb .art{position:relative;height:12.5rem;margin:1.2rem 0 .6rem;border-radius:18px;background:radial-gradient(70% 70% at 50% 40%,#FFFFFF,#F6F2EA);border:1px solid #EFEBE3;overflow:hidden}
.onb .art .p{position:absolute;filter:drop-shadow(0 10px 10px rgba(14,18,32,.12))}
.onb .art .num{position:absolute;left:1rem;bottom:.9rem;font-size:.56rem;letter-spacing:.3em;color:#8C877B;text-transform:uppercase}
.onb h1{font-family:var(--serif);font-weight:400;font-size:2.55rem;line-height:1.05;margin-top:.6rem}
.onb h1 em{font-style:italic;color:#1B2550}
.onb p{color:#5B5F6E;margin:.8rem 0 1.1rem;font-size:1rem}
.onb ul{list-style:none;margin-bottom:1.3rem;border-top:1px solid #EFEBE3}
.onb li{display:flex;gap:.9rem;align-items:baseline;padding:.7rem 0;border-bottom:1px solid #EFEBE3;font-size:.95rem;color:#41475A}
.onb li i{font-style:normal;font-family:var(--serif);font-size:.85rem;color:#A98450;min-width:1.4rem}
.onb li b{font-weight:500;color:#0E1220}
.onb .inp{margin-bottom:1.1rem;color:#0E1220;border-bottom-color:#E6E1D6}
.onb .btn{background:#1B2550;color:#fff}

.toast{position:fixed;left:50%;bottom:calc(5.6rem + env(safe-area-inset-bottom));transform:translate(-50%,16px);z-index:99;opacity:0;pointer-events:none;transition:.35s cubic-bezier(.2,.9,.3,1);
  background:var(--ink);color:var(--bg);padding:.8rem 1.2rem;border-radius:99px;font-size:.88rem;box-shadow:0 14px 30px -12px rgba(14,18,32,.5);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:98}
.celebrate{position:fixed;inset:0;z-index:97;display:grid;place-items:center;background:var(--scrim);animation:fade .25s;padding:1.4rem}
.celebrate .box{background:var(--sheet);border-radius:22px;padding:2rem 1.4rem 1.3rem;text-align:center;max-width:330px;width:100%;animation:up .4s cubic-bezier(.2,.9,.3,1)}
.celebrate .md{width:5.4rem;height:5.4rem;margin:0 auto 1rem;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-size:1.6rem;color:var(--gold-deep);
  background:radial-gradient(circle at 35% 30%,#FFFDF8,#F1E6D3);box-shadow:inset 0 0 0 1px var(--gold2),inset 0 0 0 5px #FFFDF8,inset 0 0 0 6px var(--gold2),0 14px 26px -12px rgba(138,106,61,.7);animation:pop .6s ease}
.celebrate .eb{font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-deep);margin-bottom:.4rem}
.celebrate h3{font-family:var(--serif);font-size:1.65rem;font-weight:400}
.celebrate p{color:var(--muted);margin:.4rem 0 1.3rem}

.foot{font-size:.8rem;color:var(--muted);text-align:center;margin:1.8rem .5rem 0;line-height:1.6;font-family:var(--serif);font-style:italic}

/* Doktor raporu (yazdırma) */
#rapor{position:fixed;inset:0;z-index:96;background:#fff;color:#111;overflow:auto;padding:1.2rem 1rem 6rem}
#rapor .rp{max-width:760px;margin:0 auto;font-size:13px}
#rapor .rh{display:flex;align-items:center;gap:12px;border-bottom:1px solid #1B2550;padding-bottom:12px;margin-bottom:14px}
#rapor .rh img{width:44px;height:44px;border-radius:11px}
#rapor h1{font-family:var(--serif);font-size:24px;font-weight:400;color:#0E1220}
#rapor h2{font-family:var(--serif);font-size:17px;font-weight:500;font-style:italic;margin:18px 0 8px;color:#1B2550}
#rapor table{width:100%;border-collapse:collapse}
@media screen and (max-width:700px){#rapor table{display:block;overflow-x:auto;white-space:nowrap}#rapor h1{font-size:20px}}
#rapor th,#rapor td{border-bottom:1px solid #E6E1D6;padding:6px 6px;text-align:left;vertical-align:top}
#rapor th{background:#FAF8F4;font-size:10px;text-transform:uppercase;letter-spacing:.14em;font-weight:500}
#rapor .rbar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:.6rem;padding:.8rem 1rem calc(.8rem + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #E6E1D6;justify-content:center}
#rapor .rbar .btn{max-width:240px}
#rapor .rbar .btn.line{color:#0E1220;border-color:#0E1220}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}}
@media print{
  body>*:not(#rapor){display:none!important}
  #rapor{position:static;padding:0;overflow:visible}
  #rapor .rbar{display:none}
  body{background:#fff;padding:0}
}
/* Okunabilirlik: seçenekler ve düğmeler düz, net yazı */
.btn{font-size:1rem;letter-spacing:.01em;text-transform:none;font-weight:500}
.btn.sm{font-size:.88rem;padding:.6rem .95rem}
.pill-btn{font-size:.85rem;letter-spacing:0;text-transform:none;padding:.45rem .9rem}
.seg button{font-size:.95rem;letter-spacing:0;text-transform:none;padding:.8rem .3rem}
.tabbar .tb{font-size:.74rem;letter-spacing:0;text-transform:none}
.tag{font-size:.72rem;letter-spacing:0;text-transform:none}
.stock span{font-size:.8rem;letter-spacing:0;text-transform:none}
.nextrow .nt-cd{font-size:.85rem;letter-spacing:0;text-transform:none}
.hero-foot span{font-size:.8rem;letter-spacing:0;text-transform:none}
.hero .eyebrow,.hello .eyebrow,.caps{font-size:.85rem;letter-spacing:.02em;text-transform:none}
.tl-t small{font-size:.72rem;letter-spacing:0;text-transform:none}
.fg>label,.lbl{font-size:1.02rem;letter-spacing:0;text-transform:none;color:var(--ink);font-weight:600;margin-bottom:.25rem}
.fg .ac{display:block;font-size:.86rem;color:var(--muted);margin:0 0 .8rem;line-height:1.45}
.stat span,.tile .tn,.dhero p,.preview span,.heat .h-head,.legend,.appt .ad small{letter-spacing:0;text-transform:none;font-size:.8rem}
.chips button{font-size:.95rem}
.sec .sc{letter-spacing:.02em;font-size:.85rem}
.chips button .i{display:inline-block;vertical-align:-3px;margin-right:.3rem}
.alarm .eyebrow{letter-spacing:.06em;text-transform:none;font-size:.95rem}
.opts{display:grid;gap:.5rem}
.opt{display:flex;gap:.8rem;align-items:flex-start;text-align:left;border:1px solid var(--line);border-radius:14px;padding:.85rem 1rem;width:100%}
.opt i{width:1.15rem;height:1.15rem;border-radius:50%;border:1.5px solid var(--line);flex:0 0 auto;margin-top:.15rem;position:relative}
.opt.on{border-color:var(--ink);background:var(--paper)}
.opt.on i{border-color:var(--ink)}
.opt.on i::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--ink)}
.opt b{display:block;font-weight:600;color:var(--ink)}
a.btn{text-decoration:none}
.opt span{display:block;font-size:.86rem;color:var(--muted);margin-top:.1rem}
select.inp{-webkit-appearance:none;appearance:none;background:transparent}
.ezinfo{text-align:center;padding:.6rem .4rem 1rem}
.ezpin{width:4rem;height:4rem;border-radius:50%;display:grid;place-items:center;margin:0 auto .8rem;border:1px solid var(--gold2);color:var(--gold-deep);background:var(--gold-soft)}
.ezinfo h4{font-family:var(--serif);font-weight:400;font-size:1.55rem;line-height:1.2}
.ezinfo p{color:var(--ink2);margin-top:.5rem}
.ezq{padding:.85rem 0;border-top:1px solid var(--line2)}
.ezq b{display:block;font-weight:600}
.ezq span{display:block;color:var(--ink2);font-size:.92rem;margin-top:.15rem}
.ezhead{display:flex;align-items:center;gap:.8rem;padding:.2rem 0 .6rem}
.ezhead div{flex:1;min-width:0}
.ezhead b{display:block;font-family:var(--serif);font-weight:500;font-size:1.2rem;overflow-wrap:anywhere}
.ez{padding:.95rem 0;border-bottom:1px solid var(--line2)}
.ezb b{display:block;font-family:var(--serif);font-weight:500;font-size:1.12rem}
.ezb span{display:block;color:var(--ink2);font-size:.88rem;margin-top:.15rem}
.eza{display:flex;gap:.5rem;margin-top:.65rem}
.eza .btn{text-decoration:none}
.menu .wide{grid-column:span 2;flex-direction:row;align-items:center}
.onb .hl{display:flex;gap:.9rem;align-items:flex-start;padding:.8rem 0;border-top:1px solid #EFEBE3}
.onb .hl .hi{width:2.4rem;height:2.4rem;border-radius:50%;border:1px solid #E6E1D6;display:grid;place-items:center;color:#1B2550;flex:0 0 auto}
.onb .hl b{display:block;font-weight:600;color:#0E1220}
.onb .hl span{display:block;color:#5B5F6E;font-size:.92rem}
</style>
</head>

  const n = parseInt(c, 16) || 0;
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;

  r = Math.round((t - r) * a + r); g = Math.round((t - g) * a + g); b = Math.round((t - b) * a + b);
  return "#" + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
}

// ---------- Plan ve doz hesabı ----------
function planliMi(m, g) {
  if (m.plan === "gerekirse") return false;
  if (m.baslangic && g < m.baslangic) return false;
  if (m.bitis && g > m.bitis) return false;
  if (m.durdu && g >= m.durdu) return false;
  if (m.plan === "gunler") return (m.gunler || []).includes(gd(g).getDay());
  if (m.plan === "aralik") { const f = gunFark(m.baslangic || g, g); return f >= 0 && f % Math.max(2, m.aralik || 2) === 0; }
  return true;
}
function dozlar(pid, g, prnDahil = true) {
  const p = prof(pid), out = [];
  for (const m of p.ilaclar) {
    if (!planliMi(m, g)) continue;
    for (const s of m.saatler) out.push({ pid: p.id, m, saat: s, key: m.id + "@" + s, gun: g });
  }
  if (prnDahil) for (const [k, v] of Object.entries(p.kayit[g] || {})) {
    if (!k.includes("@~")) continue;
    const m = p.ilaclar.find(x => x.id === k.split("@")[0]);
    if (m) { const d = new Date(v.t); out.push({ pid: p.id, m, saat: `${iki(d.getHours())}:${iki(d.getMinutes())}`, key: k, gun: g, prn: true }); }
  }
  return out.sort((a, b) => a.saat.localeCompare(b.saat) || a.m.ad.localeCompare(b.m.ad, "tr"));
}
const kayitAl = d => (prof(d.pid).kayit[d.gun] || {})[d.key];
function durum(d) {
  if (d.prn) return "ok";
  const k = kayitAl(d);
  if (k) return k.d;
  const t = bugun();
  if (d.gun < t) return "missed";
  if (d.gun > t) return "wait";
  const f = simdiDk() - dk(d.saat);
  return f >= 30 ? "late" : f >= 0 ? "now" : "wait";
}
const ETIKET = { ok: ["Alındı", "t-ok"], skip: ["Atlandı", "t-skip"], late: ["Gecikti", "t-late"], now: ["Saati geldi", "t-now"], wait: ["Bekliyor", "t-wait"], missed: ["Kaçırıldı", "t-missed"] };
const miktarYaz = m => `${sayiYaz(m.miktar || 1)} ${m.birim || ""}`.trim();
function planYaz(m) {
  if (m.plan === "gerekirse") return "Gerektiğinde";
  const kez = m.saatler.length === 1 ? "Günde 1 kez" : `Günde ${m.saatler.length} kez`;
  if (m.plan === "gunler") return `${(m.gunler || []).slice().sort((a, b) => ((a + 6) % 7) - ((b + 6) % 7)).map(g => GUN_K[g]).join(", ")} · ${m.saatler.length} kez`;
  if (m.plan === "aralik") return `${m.aralik} günde bir · ${m.saatler.length} kez`;
  return kez;
}
function gunlukKullanim(m) {
  if (m.plan === "gerekirse") return 0;
  const k = m.saatler.length * (m.miktar || 1);
  if (m.plan === "gunler") return k * (m.gunler || []).length / 7;
  if (m.plan === "aralik") return k / Math.max(2, m.aralik || 2);
  return k;
}
function kalanGun(m) { const u = gunlukKullanim(m); return m.stok == null || !u ? null : Math.floor(m.stok / u); }
function aktifIlac(m) { return !m.durdu && !(m.bitis && m.bitis < bugun()); }

// Uyum oranı (son n gün)
function uyum(pid, n, mid) {
  let ok = 0, top = 0;
  const t = bugun(), sd = simdiDk();
  for (let i = 0; i < n; i++) {
    const g = gunEkle(t, -i);
    for (const d of dozlar(pid, g, false)) {
      if (mid && d.m.id !== mid) continue;
      const k = kayitAl(d);
      if (g === t && !k && dk(d.saat) > sd) continue;
      top++; if (k && k.d === "ok") ok++;
    }
  }
  return { ok, top, oran: top ? ok / top : null };
}
function enErken(pid) {
  const p = prof(pid);
  let e = bugun();
  for (const m of p.ilaclar) if (m.baslangic && m.baslangic < e) e = m.baslangic;
  for (const g of Object.keys(p.kayit)) if (g < e) e = g;
  return e;
}
function gunTamam(pid, g) { const ds = dozlar(pid, g, false); return ds.length ? ds.every(d => kayitAl(d)?.d === "ok") : null; }
function seri(pid) {
  let n = 0, g = bugun();
  const e = enErken(pid);
  if (gunTamam(pid, g) === true) n++;
  g = gunEkle(g, -1);
  for (let i = 0; i < 730 && g >= e; i++, g = gunEkle(g, -1)) {
    const t = gunTamam(pid, g);
    if (t === true) n++; else if (t === false) break;
  }
  return n;
}
function enIyiSeri(pid) {
  let best = 0, cur = 0;
  const t = bugun();
  for (let g = enErken(pid), i = 0; g <= t && i < 1100; g = gunEkle(g, 1), i++) {
    const r = gunTamam(pid, g);
    if (r === true) { cur++; best = Math.max(best, cur); } else if (r === false && g !== t) cur = 0;
  }
  return best;
}
function toplamDoz(pid) { let n = 0; for (const g of Object.values(prof(pid).kayit)) for (const v of Object.values(g)) if (v.d === "ok") n++; return n; }

// 24 saatlik saat kadranı: öğle üstte, gece yarısı altta. Dozlar halkadaki işaretler, akrep şu anki saat.
function kadran(ds, g) {

  const f = n => n.toFixed(2);
  const yay = (a, b, r) => { const [x1, y1] = nk(a, r), [x2, y2] = nk(b, r); return `M${f(x1)} ${f(y1)}A${r} ${r} 0 ${b - a > 720 ? 1 : 0} 1 ${f(x2)} ${f(y2)}`; };
  let s = `<svg class="dial" viewBox="0 0 300 300" aria-hidden="true"><defs>
    <radialGradient id="kf" cx=".42" cy=".34" r=".78"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".72" stop-color="#FBF9F5"/><stop offset="1" stop-color="#EEE8DC"/></radialGradient>
    <linearGradient id="kb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F1E8D6"/><stop offset=".45" stop-color="#C2A274"/><stop offset="1" stop-color="#7F6036"/></linearGradient>
    <linearGradient id="kh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34407A"/><stop offset=".5" stop-color="#1B2550"/><stop offset="1" stop-color="#0B1128"/></linearGradient></defs>
    <circle cx="150" cy="150" r="147" fill="url(#kb)"/>
    <circle cx="150" cy="150" r="141.5" fill="#FFFDF8"/>
    <circle cx="150" cy="150" r="140" fill="url(#kf)"/>
    <path d="${yay(360, 1080, 112)}" fill="none" stroke="#B08A57" stroke-opacity=".09" stroke-width="22"/>
    <circle cx="150" cy="150" r="123" fill="none" stroke="#1B2550" stroke-opacity=".5" stroke-width=".6"/>
    <circle cx="150" cy="150" r="101" fill="none" stroke="#1B2550" stroke-opacity=".16" stroke-width=".5"/>`;
  for (let q = 0; q < 96; q++) {
    const m = q * 15, saat = q % 4 === 0, ana = q % 24 === 0;
    const [x1, y1] = nk(m, 131), [x2, y2] = nk(m, ana ? 117 : saat ? 124 : 127.5);
    s += ana ? `<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" stroke="#1B2550" stroke-width="3.4" stroke-linecap="square"/><line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" stroke="#D8C3A1" stroke-width=".7"/>`
      : `<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" stroke="${saat ? "#1B2550" : "#9A9384"}" stroke-width="${saat ? 1 : .45}"/>`;
  }
  for (const [m, l] of [[720, "12"], [1080, "18"], [0, "24"], [360, "6"]]) {
    const [x, y] = nk(m, 86);
    s += `<text x="${f(x)}" y="${f(y + 6.5)}" text-anchor="middle" font-family="'Bodoni Moda',Didot,serif" font-size="19" fill="#0E1220">${l}</text>`;
  }
  const d = gd(g);
  s += `    <rect x="177" y="141" width="27" height="18" rx="1.5" fill="#FFFFFF" stroke="#CDBF9E" stroke-width=".8"/>
    <text x="190.5" y="154.2" text-anchor="middle" font-family="'Bodoni Moda',Didot,serif" font-size="11.5" fill="#0E1220">${d.getDate()}</text>`;
  if (bugunMu && simdiDk() > 4) s += `<path d="${yay(0, simdiDk(), 127)}" fill="none" stroke="#B08A57" stroke-width="1.3" stroke-linecap="round"/>`;
  // Dozlar
  const gruplar = {};
  for (const x of ds) (gruplar[x.saat] ||= []).push(x);
  const sira = ["late", "now", "missed", "wait", "skip", "ok"];
  for (const [saat, l] of Object.entries(gruplar)) {
    const durumlar = l.map(durum).sort((a, b) => sira.indexOf(a) - sira.indexOf(b)), st = durumlar[0];
    const [x, y] = nk(dk(saat), 112), X = f(x), Y = f(y);
    const dolu = st === "ok" || st === "late" || st === "missed";
    const renk = st === "ok" ? "#B08A57" : st === "late" || st === "missed" ? "#9B2C3B" : st === "skip" ? "#B6B0A3" : st === "now" ? "#B08A57" : "#1B2550";
    if (st === "now" || st === "late") s += `<circle class="pulse" cx="${X}" cy="${Y}" r="6" fill="none" stroke="${renk}" stroke-width="1"/>`;
    s += `<circle cx="${X}" cy="${Y}" r="6.2" fill="${dolu ? renk : "#FFFFFF"}" stroke="${dolu ? "#FFFFFF" : renk}" stroke-width="${dolu ? 1.2 : 1.4}" ${st === "skip" ? 'stroke-dasharray="2 1.5"' : ""}/>`;
    if (l.length > 1) s += `<text x="${X}" y="${f(y + 2.5)}" text-anchor="middle" font-family="Jost,sans-serif" font-size="7" font-weight="600" fill="${dolu ? "#FFFFFF" : renk}">${l.length}</text>`;
    else if (st === "ok") s += `<path d="M${f(x - 2.4)} ${f(y + .1)}l1.7 1.7 3.2-3.4" stroke="#FFFFFF" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;

// Fotoğraftan ilaç tanıma
function fotoTara() { const i = $("fotoInp"); i.value = ""; i.onchange = () => i.files[0] && fotoIsle(i.files[0]); i.click(); }
async function fotoKucult(file, max = 1280) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, no) => { const x = new Image(); x.onload = () => ok(x); x.onerror = no; x.src = url; });
    const o = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement("canvas"); c.width = Math.round(img.width * o); c.height = Math.round(img.height * o);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", .85);
  } finally { URL.revokeObjectURL(url); }
}
async function fotoIsle(file) {
  $("scanT").textContent = "Kutuyu okuyorum…"; $("scanS").textContent = "Birkaç saniye sürebilir";
  try {
    const resim = await fotoKucult(file);
    const r = await fetch("/api/ilac", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ islem: "tara", resim }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.hata || "Okunamadı");
    if (!j.bulundu) throw new Error("Kutunun üzerindeki yazıyı okuyamadım. Daha yakından ve aydınlık bir yerde tekrar dene.");
    F.ad = j.ad; $("fAd").value = j.ad;
    if (j.guc) { F.guc = j.guc; $("fGuc").value = j.guc; }
    if (j.form) formSec(j.form);
    if (j.adet) { F.stok = j.adet; $("fStok").value = j.adet; }
    onizle();
    $("scanT").textContent = "Okundu ✓ Bilgileri kontrol et"; $("scanS").textContent = j.etken ? "Etken madde: " + j.etken : "Saatleri ve dozu sen seç";
    titret(30);
  } catch (e) {
    $("scanT").textContent = "Tekrar dene"; $("scanS").textContent = e.message === "Failed to fetch" ? "İnternet bağlantısı yok gibi görünüyor" : e.message;
  }
}

function ezMesafe(a, b) {

let sesCtx;
// ---------- Sesli okuma (telefonun Türkçe sesiyle) ----------
const konusVar = () => "speechSynthesis" in window;
let konusHazir = false;
function trSes() { try { return speechSynthesis.getVoices().find(v => /^tr/i.test(v.lang)) || null; } catch { return null; } }
const BIRIM_OKU = { ml: "mililitre", mg: "miligram", mcg: "mikrogram", g: "gram", iu: "ünite" };
function birimOku(t) {
  return String(t || "").replace(/(\d)[.,](\d)/g, "$1 virgül $2").replace(/(\d)\s*(mcg|mg|ml|iu|g)\b/gi, (m, n, b) => `${n} ${BIRIM_OKU[b.toLowerCase()]}`).replace(/%\s*(\d)/g, "yüzde $1");
}
function miktarOku(m) {

  const sayi = yarim ? (t ? `${t} buçuk` : "yarım") : String(t);

}
function alarmMetni(liste) {

  const parca = liste.map(x => [S.profiller.length > 1 && x.pid !== S.profiller[0].id ? gorunenAd(prof(x.pid)) + " için" : "",
    birimOku(x.m.ad + (x.m.guc ? " " + x.m.guc : "")), miktarOku(x.m), x.m.nasil && x.m.nasil !== NASIL[0] ? x.m.nasil.toLocaleLowerCase("tr") : ""].filter(Boolean).join(", "));

  if (konusVar() && !trSes()) setTimeout(() => toast("Telefonunda Türkçe ses bulunamadı; okuma farklı bir dilde olabilir"), 600);
}
function sesHazir() {
  // iPhone sesli okumaya ancak bir dokunuştan sonra izin verir: ilk dokunuşta sessizce hazırla
  if (konusVar() && !konusHazir) { try { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); konusHazir = true; } catch {} }
  try { sesCtx ||= new (window.AudioContext || window.webkitAudioContext)(); if (sesCtx.state === "suspended") sesCtx.resume(); } catch {} }
document.addEventListener("pointerdown", sesHazir, { passive: true });
function zil(zorla) {
  if (!S.ayar.ses && !zorla) return;
  try {
    sesHazir(); const t0 = sesCtx.currentTime;
    const nota = (f, t, sure = .9, tip = "sine", ses = .22) => {
      const o = sesCtx.createOscillator(), g = sesCtx.createGain();
      o.type = tip; o.frequency.value = f;
      g.gain.setValueAtTime(0, t0 + t); g.gain.linearRampToValueAtTime(ses, t0 + t + .015); g.gain.exponentialRampToValueAtTime(.0008, t0 + t + sure);
      o.connect(g).connect(sesCtx.destination); o.start(t0 + t); o.stop(t0 + t + sure + .05);
      if (tip === "sine") { const o2 = sesCtx.createOscillator(), g2 = sesCtx.createGain(); o2.frequency.value = f * 2.01; g2.gain.setValueAtTime(0, t0 + t); g2.gain.linearRampToValueAtTime(ses * .25, t0 + t + .01); g2.gain.exponentialRampToValueAtTime(.0005, t0 + t + sure * .6); o2.connect(g2).connect(sesCtx.destination); o2.start(t0 + t); o2.stop(t0 + t + sure); }
    };
    if (S.ayar.zil === "yumusak") [[523, 0], [659, 0], [784, 0], [659, .8], [784, .8], [1047, .8]].forEach(([f, t]) => nota(f, t, 1.6, "sine", .1));
    else if (S.ayar.zil === "klasik") [0, .22, .44, 1.1, 1.32, 1.54].forEach(t => nota(988, t, .16, "square", .06));

// Her 20 saniyede bir: saati gelen dozlar ve yaklaşan randevular
function kontrol() {
  const g = bugun(), sd = simdiDk(), simdi = Date.now();
  for (const k of Object.keys(S.haber)) if (!k.startsWith(g) && !k.startsWith("r|")) delete S.haber[k];
  for (const k of Object.keys(S.ertele)) if (!k.startsWith(g)) delete S.ertele[k];
  const vade = [];
  for (const p of S.profiller) for (const d of dozlar(p.id, g, false)) {
    if (kayitAl(d)) continue;
    const f = sd - dk(d.saat);
    if (f < 0 || f > 180) continue;
    const ek = `${g}|${p.id}|${d.key}`;
    if (S.ertele[ek]) { if (simdi >= S.ertele[ek]) { delete S.ertele[ek]; vade.push(d); } continue; }
    if (!S.haber[ek + "|1"]) { S.haber[ek + "|1"] = 1; vade.push(d); }
    else if (f >= 15 && !S.haber[ek + "|2"]) { S.haber[ek + "|2"] = 1; vade.push(d); }
  }
  let degisti = vade.length > 0;
  if (vade.length) {
    const yeni = vade.filter(x => !aktifAlarm.some(a => a.key === x.key && a.pid === x.pid));
    if (yeni.length) {
      alarmGoster([...aktifAlarm.filter(a => !a.deneme), ...yeni]);
      const cok = S.profiller.length > 1;
      bildirimGonder(yeni.length === 1 ? `${yeni[0].m.ad} zamanı` : `${yeni.length} ilacın zamanı geldi`,
        yeni.map(x => `${x.saat} · ${x.m.ad} ${x.m.guc || ""} — ${miktarYaz(x.m)}${x.m.nasil !== NASIL[0] ? " (" + x.m.nasil + ")" : ""}${cok ? " · " + prof(x.pid).ad : ""}`).join("\n"),
        "ilac-" + g + "-" + yeni.map(x => x.key).join(","), { dozlar: yeni.map(x => [x.pid, x.key]), gun: g });
    }
  }
  // Randevular: 1 gün ve 1 saat önce
  for (const p of S.profiller) for (const r of p.randevular) {
    const f = (new Date(r.t) - simdi) / 60000;
    for (const [es, ad] of [[1440, "1g"], [60, "1s"]]) {
      if (f > 0 && f <= es && !S.haber[`r|${r.id}|${ad}`]) {
        S.haber[`r|${r.id}|${ad}`] = 1; degisti = true;
        bildirimGonder(`${ad === "1g" ? "Yarın" : "Birazdan"} randevun var`, `${randevuZaman(r)} · ${r.doktor || r.bolum}${r.yer ? " · " + r.yer : ""}`, "r-" + r.id);
        if (ad === "1s" || f < 180) toast(`${r.doktor || r.bolum}: ${randevuZaman(r)}`);
        break;
      }
    }
  }
  if (degisti) kaydet();
  if (ui.tab === "bugun" && !yigin.length) ciz();
}

    <p>İlaçlarını ekle, saati geldiğinde sana hatırlatalım. Aldığın dozları işaretle, hiçbirini kaçırma.</p>
    ${satir("bell", "Saatinde hatırlatma", "İlacın saati geldiğinde telefonun seni uyarır.")}
    ${satir("camera", "Kutudan tanıma", "İlaç kutusunun fotoğrafını çek; adı ve dozu kendiliğinden yazılsın.")}
    ${satir("users", "Ailen için", "Annenin, babanın ya da çocuğunun ilaçlarını ayrı ayrı takip et.")}
    ${satir("map", "Eczaneler", "Yakınındaki ve nöbetçi eczaneleri gör.")}
    ${satir("shield", "Gizlilik", "Bilgilerin yalnızca bu telefonda saklanır.")}
    <div style="border-top:1px solid #EFEBE3;padding-top:1rem;margin-top:.2rem"><label style="font-weight:600;display:block">Adın</label><span style="color:#8C877B;font-size:.86rem">İsteğe bağlı. Seni adınla selamlayalım.</span>
    <input class="inp" id="onbAd" maxlength="20" placeholder="Örn. Ayşe" autocomplete="given-name"></div>
    <button class="btn" onclick="karsilamaBitti()">Başla</button></div>`;
  document.body.appendChild(d);
}
function karsilamaBitti() {
  S.ayar.isim = ($("onbAd").value || "").trim().slice(0, 20); S.ayar.hosgeldin = true; kaydet();
  $("onb").style.transition = ".4s"; $("onb").style.opacity = "0"; setTimeout(() => $("onb")?.remove(), 400);
  ciz(); sesHazir();
}

// ---------- Başlangıç ----------
const TABS = { bugun: ["home", "Bugün"], ilaclar: ["pill", "İlaçlar"], saglik: ["heart", "Sağlık"], rapor: ["chart", "Rapor"] };
document.querySelectorAll(".tabbar .tb").forEach(b => {
  const [i, a] = TABS[b.dataset.t]; b.innerHTML = ic(i, 23) + a;
  b.onclick = () => { ui.tab = b.dataset.t; if (b.dataset.t === "bugun") ui.gun = bugun(); ciz(); scrollTo({ top: 0, behavior: "smooth" }); };
});
document.querySelector(".fab").innerHTML = ic("plus", 28, 2.4);

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/ilac/sw.js", { scope: "/ilac/" }).catch(() => {});
  navigator.serviceWorker.addEventListener("message", e => {
    const v = e.data || {};
    if (v.tip === "aldim" && Array.isArray(v.dozlar)) { v.dozlar.forEach(([pid, key]) => S.profiller.some(p => p.id === pid) && !kayitAl({ pid, key, gun: v.gun }) && al(pid, key, v.gun, true)); alarmKapat(); ciz(); toast("Kaydedildi ✓"); }
    else if (v.tip === "ertele" && Array.isArray(v.dozlar)) { v.dozlar.forEach(([pid, key]) => S.ertele[v.gun + "|" + pid + "|" + key] = Date.now() + 10 * 60000); kaydet(); alarmKapat(); }
    else kontrol();
  });
}
// Bildirimdeki düğmeyle açıldıysa
(function () {
  const q = new URLSearchParams(location.search);
  if (q.get("islem") && q.get("d")) {
    try {
      const dz = JSON.parse(q.get("d")), g = q.get("gun");
      if (q.get("islem") === "aldim") { dz.forEach(([pid, key]) => S.profiller.some(p => p.id === pid) && !kayitAl({ pid, key, gun: g }) && al(pid, key, g, true)); setTimeout(() => toast("Kaydedildi ✓"), 400); }
      if (q.get("islem") === "ertele") { dz.forEach(([pid, key]) => S.ertele[g + "|" + pid + "|" + key] = Date.now() + 10 * 60000); kaydet(); setTimeout(() => toast("10 dakika sonra tekrar hatırlatacağım"), 400); }
    } catch {}
    history.replaceState(null, "", "/ilac/");
  }
  const kisa = q.get("ekle");
  if (kisa) { history.replaceState(null, "", "/ilac/"); setTimeout(() => kisa === "olcum" ? olcumFormu() : ilacFormu(), 300); }
})();

ciz();
if (!S.ayar.hosgeldin) karsilama();
kontrol();
setInterval(kontrol, 20000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { if (ui.gun !== bugun() && ui.tab === "bugun") ui.gun = bugun(); kontrol(); if (!yigin.length) ciz(); } });
</script>
</body>
