<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dolapta Ne Var">
<meta name="theme-color" content="#14100C">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">
<title>Dolapta Ne Var?</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF5EC; --card:#FFFDF8; --ink:#2A1E14; --muted:#8C7A64; --line:#EADFCB;
    --gold:#B8862F; --gold2:#E9C77B; --gold-deep:#7A5418; --espresso:#1C140D;
    --sweet:#A8566F; --sweet-bg:#F7E9EC; --salty:#8A6A2E; --salty-bg:#F3EAD6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);min-height:100vh;padding-bottom:80px;
    background:radial-gradient(ellipse 120% 60% at 50% 0%,#FFFBF2 0%,var(--bg) 60%) fixed,var(--bg)}
  .wrap{max-width:520px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom))}
  header{text-align:center;padding:12px 0 22px}
  .logo{width:96px;height:96px;border-radius:24px;display:block;margin:0 auto;
    box-shadow:0 10px 28px rgba(122,84,24,.28),0 0 0 1px rgba(184,134,47,.35)}
  h1{font-family:Fraunces,serif;font-weight:800;font-size:32px;margin-top:16px;letter-spacing:-.5px;
     background:linear-gradient(100deg,#7A5418 0%,#C9973B 35%,#E9C77B 50%,#B8862F 65%,#7A5418 100%);
     -webkit-background-clip:text;background-clip:text;color:transparent}
  .orn{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px auto 0;color:var(--gold);font-size:11px}
  .orn::before,.orn::after{content:"";height:1px;width:56px;background:linear-gradient(90deg,transparent,var(--gold))}
  .orn::after{background:linear-gradient(90deg,var(--gold),transparent)}
  .sub{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:500;color:#7D6A55;font-size:19px;margin-top:6px}

  .tabs{display:flex;margin-bottom:18px;border-bottom:1px solid var(--line)}
  .tabs button{flex:1;border:0;background:none;padding:12px 4px 13px;font:700 12px Nunito;letter-spacing:2.5px;text-transform:uppercase;
    color:var(--muted);cursor:pointer;position:relative}
  .tabs button.on{color:var(--ink)}
  .tabs button.on::after{content:"";position:absolute;left:22%;right:22%;bottom:-1px;height:2px;border-radius:2px;
    background:linear-gradient(90deg,var(--gold),var(--gold2),var(--gold))}
  #favCount{color:var(--gold)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:14px;
    box-shadow:0 1px 0 #fff inset,0 12px 30px -14px rgba(90,60,20,.18)}
  label.t{display:block;font-family:Fraunces,serif;font-weight:600;font-size:18px;margin-bottom:12px}
  .inrow{display:flex;gap:8px}
  input[type=text]{flex:1;border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px 15px;font:600 16px Nunito;color:var(--ink);outline:none;min-width:0;
    transition:border-color .2s,box-shadow .2s}
  input[type=text]:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(233,199,123,.25)}
  .add{border:0;background:var(--espresso);color:var(--gold2);border-radius:14px;width:50px;font:400 26px Nunito;cursor:pointer}
  .cam{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:10px;padding:13px;border-radius:14px;cursor:pointer;
    border:1px dashed var(--gold);background:linear-gradient(180deg,#FFFBF1,#F7ECD4);color:var(--gold-deep);font:700 12px Nunito;letter-spacing:2px;text-transform:uppercase}
  .cam svg{width:19px;height:19px}
  .cam:disabled{opacity:.6;cursor:wait}
  .camnote{font-size:13px;color:var(--muted);margin-top:8px;text-align:center;min-height:0}
  .camnote.ok{color:var(--gold-deep);font-weight:700}
  .camnote.err{color:#8A3A22}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;min-height:4px}
  .chip{background:linear-gradient(180deg,#FFF9EC,#F8EED9);border:1px solid #E6D3AC;border-radius:999px;padding:6px 7px 6px 13px;
    font-weight:700;font-size:14px;display:flex;align-items:center;gap:7px;color:var(--gold-deep)}
  .chip button{border:0;background:rgba(184,134,47,.15);width:20px;height:20px;border-radius:50%;cursor:pointer;font-size:10px;color:var(--gold-deep)}
  .hint{color:var(--muted);font-size:13px;margin-top:12px}
  .quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .quick button{border:1px solid var(--line);background:none;border-radius:999px;padding:5px 11px;font:600 13px Nunito;color:var(--muted);cursor:pointer}

  .types{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .type{border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px 6px 12px;text-align:center;cursor:pointer;
    font:700 11px Nunito;letter-spacing:1px;text-transform:uppercase;color:var(--muted);transition:all .2s;min-width:0}
  .type .e{font-size:26px;display:block;margin-bottom:6px}
  .type.on{border-color:var(--gold);color:var(--gold-deep);background:linear-gradient(180deg,#FFFBF1,#F7ECD4);
    box-shadow:0 0 0 1px var(--gold) inset,0 8px 18px -10px rgba(184,134,47,.6)}

  .go{width:100%;border:0;border-radius:18px;padding:18px;font:800 14px Nunito;letter-spacing:3px;text-transform:uppercase;color:var(--espresso);cursor:pointer;
      background:linear-gradient(135deg,#C9973B,#F1D48E 50%,#C9973B);box-shadow:0 12px 26px -10px rgba(184,134,47,.75),0 1px 0 rgba(255,255,255,.6) inset}
  .go:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}

  .status{text-align:center;color:var(--muted);padding:28px 8px;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:19px}
  .spin{width:38px;height:38px;margin:0 auto 12px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--gold);animation:dn 1s linear infinite}
  @keyframes dn{to{transform:rotate(360deg)}}
  .err{background:#FBEFEA;border:1px solid #EBCFC3;color:#8A3A22;border-radius:14px;padding:13px;font-size:14px;margin-bottom:14px}
  .lead{font-family:"Cormorant Garamond",serif;font-style:italic;color:var(--muted);font-size:18px;text-align:center;margin:4px 0 14px}

  .recipe{padding:0;overflow:hidden}
  .rhead{padding:18px;display:flex;gap:14px;align-items:flex-start;cursor:pointer}
  .remoji{flex-shrink:0;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:28px;
    background:radial-gradient(circle at 35% 30%,#FFFDF6,#F3E6C8);box-shadow:0 0 0 1px var(--gold2),0 6px 14px -6px rgba(122,84,24,.4)}
  .rtitle{font-family:Fraunces,serif;font-weight:600;font-size:20px;line-height:1.2}
  .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .tag{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:#F4EEE3;color:var(--muted)}
  .tag.s{background:var(--sweet-bg);color:var(--sweet)} .tag.t2{background:var(--salty-bg);color:var(--salty)}
  .fav{margin-left:auto;border:0;background:none;font-size:22px;cursor:pointer;flex-shrink:0;line-height:1}
  .desc{font-size:14px;color:var(--muted);margin-top:8px;line-height:1.5}
  .more{display:block;margin-top:10px;font:700 11px Nunito;letter-spacing:2px;text-transform:uppercase;color:var(--gold)}
  .recipe.open .more{display:none}
  .rbody{display:none;padding:0 18px 20px}
  .recipe.open .rbody{display:block;animation:open .35s ease}
  @keyframes open{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}


  .rbody h3{display:flex;align-items:center;gap:10px;font:700 11px Nunito;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);margin:20px 0 10px}
  .rbody h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold2),transparent)}
  .ings{list-style:none;font-size:15px;line-height:1.5}
  .ings li{padding:7px 0 7px 18px;border-bottom:1px dashed var(--line);position:relative}
  .ings li:last-child{border-bottom:0}
  .ings li::before{content:"";position:absolute;left:2px;top:15px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
  .steps{list-style:none;counter-reset:a;font-size:15px;line-height:1.6}
  .steps li{counter-increment:a;position:relative;padding:0 0 14px 42px}
  .steps li::before{content:counter(a);position:absolute;left:0;top:-1px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
    font:700 13px Fraunces,serif;color:var(--gold-deep);background:linear-gradient(180deg,#FFF9EC,#F3E2BB);box-shadow:0 0 0 1px var(--gold2)}
  .miss{margin-top:10px;font-size:14px;color:var(--sweet);font-weight:700}

  .share{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:10px;border:0;border-radius:999px;padding:15px;
    font:700 12px Nunito;letter-spacing:3px;text-transform:uppercase;color:var(--gold2);cursor:pointer;
    background:linear-gradient(180deg,#2A1E14,#15100B);box-shadow:0 0 0 1px rgba(233,199,123,.45) inset,0 10px 22px -10px rgba(28,20,13,.7)}
  .share svg{width:17px;height:17px}
  .share:active{transform:scale(.98)}

  .empty{text-align:center;color:var(--muted);padding:48px 16px;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:19px}
  .empty .e{font-size:40px;color:var(--gold);font-style:normal;margin-bottom:8px}
  .install{display:none;width:100%;margin-bottom:16px;border:1px solid var(--gold2);background:linear-gradient(180deg,#FFFBF1,#F7ECD4);color:var(--gold-deep);
      border-radius:16px;padding:13px;font:700 14px Nunito;cursor:pointer;text-align:center}
  .install.show{display:block}
  .install small{display:block;font-weight:600;color:var(--muted);margin-top:4px}

  /* --- Tercihler --- */
  details.prefs{padding:0}
  details.prefs summary{list-style:none;cursor:pointer;padding:18px 20px;display:flex;align-items:center;gap:10px}
  details.prefs summary::-webkit-details-marker{display:none}
  details.prefs summary .t{margin:0;flex:1;font-family:Fraunces,serif;font-weight:600;font-size:18px}
  details.prefs summary .ozet{font-size:12px;color:var(--gold-deep);font-weight:700;text-align:right}
  details.prefs summary::after{content:"›";color:var(--gold);font-size:22px;transition:transform .2s}
  details.prefs[open] summary::after{transform:rotate(90deg)}
  .pbody{padding:0 20px 20px}
  .plabel{font:700 11px Nunito;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:14px 0 8px}
  .plabel:first-child{margin-top:0}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opt{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font:700 13px Nunito;color:var(--muted);cursor:pointer}
  .opt.on{border-color:var(--gold);color:var(--gold-deep);background:linear-gradient(180deg,#FFFBF1,#F7ECD4);box-shadow:0 0 0 1px var(--gold) inset}
  .stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:#fff;overflow:hidden}
  .stepper button{border:0;background:none;width:44px;height:40px;font:400 22px Nunito;color:var(--gold-deep);cursor:pointer}
  .stepper span{min-width:70px;text-align:center;font:700 15px Nunito}

  /* --- Alışveriş listesi --- */
  .missrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
  .missrow .miss{margin:0;flex:1;min-width:150px}
  .tolist{border:1px solid var(--gold2);background:#FFFBF1;color:var(--gold-deep);border-radius:999px;padding:7px 12px;font:700 12px Nunito;cursor:pointer;white-space:nowrap}
  .tolist:disabled{opacity:.7;cursor:default}
  .shop li{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px dashed var(--line);list-style:none}
  .shop li:last-child{border-bottom:0}
  .shop .box{flex-shrink:0;width:24px;height:24px;border-radius:7px;border:1.5px solid var(--gold);background:#fff;cursor:pointer;display:grid;place-items:center;color:#fff;font-size:14px}
  .shop li.done .box{background:var(--gold)}
  .shop .nm{flex:1;font-size:15px;cursor:pointer}
  .shop .nm small{display:block;color:var(--muted);font-size:12px}
  .shop li.done .nm{text-decoration:line-through;color:var(--muted)}
  .shop .del{border:0;background:none;color:var(--muted);font-size:14px;cursor:pointer;padding:4px}
  .shopbar{display:flex;gap:8px;margin-top:14px}
  .ghost{flex:1;border:1px solid var(--line);background:#fff;border-radius:999px;padding:11px;font:700 12px Nunito;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);cursor:pointer}

  /* --- Pişirme modu --- */
  .cookbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:6px;border:1px solid var(--gold);border-radius:999px;padding:14px;
    font:700 12px Nunito;letter-spacing:3px;text-transform:uppercase;color:var(--gold-deep);cursor:pointer;background:linear-gradient(180deg,#FFFBF1,#F3E2BB)}
  #cook{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;color:#F6EBD3;
    padding:calc(18px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom));
    background:radial-gradient(ellipse at 50% 20%,#3A2A18 0%,#1C140D 55%,#0D0906 100%)}
  #cook[hidden]{display:none}
  #cook .top{display:flex;align-items:center;gap:12px}
  #cook .top b{flex:1;font:600 17px Fraunces,serif;color:var(--gold2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #cook .x{border:1px solid rgba(233,199,123,.4);background:none;color:var(--gold2);width:40px;height:40px;border-radius:50%;font-size:16px;cursor:pointer}
  #cook .bar{height:3px;border-radius:3px;background:rgba(233,199,123,.18);margin-top:16px;overflow:hidden}
  #cook .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .35s}
  #cook .mid{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:20px 4px}
  #cook .no{font:700 12px Nunito;letter-spacing:4px;text-transform:uppercase;color:var(--gold)}
  #cook .txt{font:500 27px/1.4 Fraunces,serif;margin-top:16px}
  #cook .timer{align-self:center;margin-top:26px;border:1px solid var(--gold2);background:rgba(233,199,123,.08);color:var(--gold2);border-radius:999px;padding:11px 20px;font:700 15px Nunito;cursor:pointer}
  #cook .timer.run{background:var(--gold2);color:var(--espresso)}
  #cook .nav{display:flex;gap:10px}
  #cook .nav button{flex:1;border-radius:999px;padding:16px;font:700 12px Nunito;letter-spacing:2.5px;text-transform:uppercase;cursor:pointer}
  #cook .prev{border:1px solid rgba(233,199,123,.4);background:none;color:var(--gold2)}
  #cook .next{border:0;color:var(--espresso);background:linear-gradient(135deg,#C9973B,#F1D48E 50%,#C9973B)}
  #cook .prev:disabled{opacity:.3}
  #cook .wake{text-align:center;font-size:11px;color:#8C7A64;margin-top:12px;letter-spacing:1px}

  /* --- Lüks giriş ekranı --- */
  #intro{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;text-align:center;cursor:pointer;
    background:radial-gradient(ellipse at 50% 38%,#3A2A18 0%,#1C140D 45%,#0D0906 100%);
    transition:opacity .8s ease,visibility .8s ease}
  #intro.gone{opacity:0;visibility:hidden}
  #intro .halo{position:relative;width:168px;height:168px;display:grid;place-items:center}
  #intro .halo::before{content:"";position:absolute;inset:-40px;border-radius:50%;
    background:radial-gradient(circle,rgba(233,199,123,.35) 0%,rgba(233,199,123,0) 65%);animation:glow 3s ease-in-out infinite}
  #intro .halo::after{content:"";position:absolute;inset:-14px;border-radius:44px;border:1px solid rgba(233,199,123,.45)}
  #intro img{position:relative;width:168px;height:168px;border-radius:38px;box-shadow:0 20px 50px rgba(0,0,0,.55),0 0 0 1px rgba(233,199,123,.5);
    animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both}
  #intro h2{font-family:Fraunces,serif;font-weight:800;font-size:38px;margin-top:40px;letter-spacing:-.5px;
    background:linear-gradient(100deg,#B8862F 0%,#F6DFA4 30%,#FFF4D6 45%,#E9C77B 60%,#B8862F 100%);background-size:250% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;animation:fade 1s .35s both,shine 3.2s 1.1s ease-in-out infinite}
  #intro .line{display:flex;align-items:center;gap:12px;margin-top:14px;color:#E9C77B;font-size:12px;animation:fade 1s .6s both}
  #intro .line::before,#intro .line::after{content:"";width:64px;height:1px;background:linear-gradient(90deg,transparent,#E9C77B)}
  #intro .line::after{background:linear-gradient(90deg,#E9C77B,transparent)}
  #intro p{font-family:"Cormorant Garamond",serif;font-style:italic;color:#D9C6A3;font-size:21px;margin-top:12px;animation:fade 1s .8s both}
  #intro button{margin-top:44px;border:1px solid #E9C77B;background:rgba(233,199,123,.08);color:#F6DFA4;
    font:600 13px Nunito;letter-spacing:4px;text-transform:uppercase;padding:14px 34px;border-radius:999px;cursor:pointer;
    animation:fade 1s 1.1s both}
  @keyframes rise{from{opacity:0;transform:translateY(18px) scale(.92)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes glow{0%,100%{opacity:.6;transform:scale(.95)}50%{opacity:1;transform:scale(1.05)}}
  @keyframes shine{0%,100%{background-position:100% 0}50%{background-position:0 0}}
  @media (prefers-reduced-motion:reduce){#intro *,#intro *::before{animation:none!important}}
</style>
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>

<body>
<div id="intro" role="dialog" aria-label="Giriş">
  <div class="halo"><img src="/icon-512.png" alt="" width="168" height="168"></div>
  <h2>Dolapta Ne Var?</h2>
  <div class="line">✦</div>
  <p>Dolabındakiler, şefin elinde.</p>
  <button type="button">Mutfağa Gir</button>
</div>
<div class="wrap">
  <header>
    <img class="logo" src="/logo.png" alt="Dolapta Ne Var? logosu" width="96" height="96">
    <h1>Dolapta Ne Var?</h1>
    <div class="orn">✦</div>
    <p class="sub">Malzemelerini yaz, ne pişireceğini biz düşünelim.</p>
  </header>

  <button class="install" id="install">📲 Uygulamayı telefonuna yükle</button>

  <div class="tabs">
    <button class="on" data-tab="find">Tarif Bul</button>
    <button data-tab="favs">Favoriler <span id="favCount"></span></button>
    <button data-tab="shop">Alışveriş <span id="shopCount"></span></button>
  </div>

  <section id="find">
    <div class="card">
      <label class="t" for="ing">Elinde hangi malzemeler var?</label>
      <form class="inrow" id="addForm">
        <input type="text" id="ing" placeholder="örn. yumurta" autocomplete="off">
        <button class="add" type="submit" aria-label="Ekle">+</button>
      </form>
      <button class="cam" id="cam" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.6l1.4-2h5l1.4 2h1.6A2.5 2.5 0 0 1 20 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5z"/><circle cx="12" cy="13" r="3.6"/></svg>
        <span>Dolabın fotoğrafını çek</span>
      </button>
      <input type="file" id="camFile" accept="image/*" capture="environment" hidden>
      <p class="camnote" id="camNote"></p>
      <div class="chips" id="chips"></div>
      <div class="quick" id="quick"></div>
      <p class="hint">İpucu: Virgülle birden fazla yazabilirsin (un, şeker, süt).</p>
    </div>

    <div class="card">
      <label class="t">Canın ne çekiyor?</label>
      <div class="types">
        <button class="type" data-type="kahvaltı"><span class="e">🍳</span>Kahvaltı</button>
        <button class="type" data-type="öğle yemeği"><span class="e">🥗</span>Öğle</button>
        <button class="type" data-type="akşam yemeği"><span class="e">🍲</span>Akşam</button>
        <button class="type" data-type="atıştırmalık"><span class="e">🥨</span>Atıştırmalık</button>
        <button class="type" data-type="tatlı"><span class="e">🍰</span>Tatlı</button>
        <button class="type on" data-type="fark etmez"><span class="e">✨</span>Fark Etmez</button>
      </div>
    </div>

    <details class="card prefs" id="prefs">
      <summary><span class="t">Tercihlerim</span><span class="ozet" id="prefOzet"></span></summary>
      <div class="pbody">
        <p class="plabel">Kaç kişilik?</p>
        <div class="stepper"><button type="button" id="kisiAz" aria-label="Azalt">−</button><span id="kisiSay"></span><button type="button" id="kisiCok" aria-label="Artır">+</button></div>
        <p class="plabel">Beslenme</p>
        <div class="opts" id="diyetler"></div>
        <p class="plabel">En fazla ne kadar sürsün?</p>
        <div class="opts" id="sureler"></div>
      </div>
    </details>

    <button class="go" id="go" disabled>Tarifleri Göster ✦</button>
    <div id="results" style="margin-top:18px"></div>
  </section>

  <section id="favs" hidden>
    <div id="favList"></div>
  </section>

  <section id="shop" hidden>
    <div class="card">
      <label class="t" for="shopIn">Alışveriş listem</label>
      <form class="inrow" id="shopForm">
        <input type="text" id="shopIn" placeholder="örn. tereyağı" autocomplete="off">
        <button class="add" type="submit" aria-label="Ekle">+</button>
      </form>
      <ul class="shop" id="shopList"></ul>
      <div class="shopbar" id="shopBar">
        <button class="ghost" id="shopClear" type="button">Alınanları sil</button>
        <button class="ghost" id="shopShare" type="button">Paylaş</button>
      </div>
    </div>
  </section>
</div>

<div id="cook" hidden role="dialog" aria-label="Pişirme modu">
  <div class="top"><b id="cookAd"></b><button class="x" id="cookX" aria-label="Kapat">✕</button></div>
  <div class="bar"><i id="cookBar"></i></div>
  <div class="mid">
    <p class="no" id="cookNo"></p>
    <p class="txt" id="cookTxt"></p>
    <button class="timer" id="cookTimer" hidden></button>
  </div>
  <div class="nav"><button class="prev" id="cookPrev">‹ Geri</button><button class="next" id="cookNext">İleri ›</button></div>
  <p class="wake" id="cookWake"></p>
</div>

<script>
const $ = s => document.querySelector(s);
let ingredients = [];
let type = "fark etmez";
let lastRecipes = [];
let favs = [];
try { favs = JSON.parse(localStorage.getItem("tarif-favs") || "[]"); } catch(e) {}
const saveFavs = () => { try { localStorage.setItem("tarif-favs", JSON.stringify(favs)); } catch(e) {} };

const QUICK = ["yumurta","un","süt","şeker","domates","peynir","patates","tavuk","makarna","soğan"];

function esc(s){ return String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function renderChips(){
  $("#chips").innerHTML = ingredients.map((x,i)=>
    `<span class="chip">${esc(x)}<button data-i="${i}" aria-label="Sil">✕</button></span>`).join("");
  $("#quick").innerHTML = QUICK.filter(q=>!ingredients.includes(q))
    .slice(0,6).map(q=>`<button data-q="${q}">+ ${q}</button>`).join("");
  $("#go").disabled = ingredients.length === 0;
}
function addIng(text){
  text.split(",").map(s=>s.trim().toLocaleLowerCase("tr")).filter(Boolean)
    .forEach(s=>{ if(!ingredients.includes(s)) ingredients.push(s); });
  renderChips();
}
$("#addForm").addEventListener("submit", e=>{ e.preventDefault(); addIng($("#ing").value); $("#ing").value=""; $("#ing").focus(); });
$("#chips").addEventListener("click", e=>{ const i=e.target.dataset.i; if(i!==undefined){ ingredients.splice(+i,1); renderChips(); }});
$("#quick").addEventListener("click", e=>{ if(e.target.dataset.q) addIng(e.target.dataset.q); });

document.querySelectorAll(".type").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".type").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); type = b.dataset.type;
}));

document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");
  ["find","favs","shop"].forEach(id => $("#"+id).hidden = b.dataset.tab!==id);
  if(b.dataset.tab==="favs") renderFavs();
  if(b.dataset.tab==="shop") renderShop();
}));

function isFav(r){ return favs.some(f=>f.ad===r.ad); }
const SHARE_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7.5 7.5 12 3l4.5 4.5"/><path d="M5 12v6.5A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V12"/></svg>`;
function recipeCard(r, idx, src){
  const kind = (r.tur||r.ogun||"").toLocaleLowerCase("tr").includes("tatl") ? "s" : "t2";
  const etiket = r.ogun || (kind==="s"?"Tatlı":"Tuzlu");
  const miss = (r.eksik_malzemeler||[]).filter(Boolean);
  return `<div class="card recipe" data-src="${src}" data-idx="${idx}">
    <div class="rhead">
      <div class="remoji">${esc(r.emoji||"🍽️")}</div>
      <div style="flex:1;min-width:0">
        <div class="rtitle">${esc(r.ad)}</div>
        <div class="meta">
          <span class="tag ${kind}">${esc(etiket)}</span>
          ${r.sure?`<span class="tag">${esc(r.sure)}</span>`:""}
          ${r.zorluk?`<span class="tag">${esc(r.zorluk)}</span>`:""}
        </div>
        ${r.aciklama?`<div class="desc">${esc(r.aciklama)}</div>`:""}
        <span class="more">Tarifi gör ›</span>
      </div>
      <button class="fav" data-fav aria-label="Favori">${isFav(r)?"❤️":"🤍"}</button>
    </div>
    <div class="rbody">
      <h3>Malzemeler</h3>
      <ul class="ings">${(r.malzemeler||[]).map(m=>`<li>${esc(m)}</li>`).join("")}</ul>
      ${miss.length?`<div class="missrow"><p class="miss">Eksik olabilir: ${miss.map(esc).join(", ")}</p><button class="tolist" data-tolist>🛒 Listeye ekle</button></div>`:""}
      <h3>Yapılışı</h3>
      <ol class="steps">${(r.adimlar||[]).map(a=>`<li>${esc(a)}</li>`).join("")}</ol>
      <button class="cookbtn" data-cook>Pişirmeye Başla ✦</button>
      <button class="share" data-share>${SHARE_ICON}<span>Tarifi Paylaş</span></button>
    </div>
  </div>`;
}
function bindCards(container, list){
  container.querySelectorAll(".recipe").forEach(el=>{
    const r = list[+el.dataset.idx];
    el.querySelector("[data-share]").addEventListener("click", ()=>shareRecipe(r));
    el.querySelector("[data-cook]").addEventListener("click", ()=>pisir(r));
    const tl = el.querySelector("[data-tolist]");
    if (tl) tl.addEventListener("click", ()=>{
      const n = listeyeEkle(r.eksik_malzemeler||[], r.ad);
      tl.textContent = n ? `✓ ${n} ürün eklendi` : "✓ Zaten listede"; tl.disabled = true;
    });
    el.querySelector(".rhead").addEventListener("click", e=>{
      if(e.target.closest("[data-fav]")){
        if(isFav(r)) favs = favs.filter(f=>f.ad!==r.ad); else favs.push(r);
        saveFavs(); updateFavCount();
        e.target.textContent = isFav(r)?"❤️":"🤍";
        if(el.dataset.src==="favs") renderFavs();
        return;
      }
      el.classList.toggle("open");
    });
  });
}
function recipeText(r){
  const lines = [`${r.emoji||"🍽️"} ${r.ad}`];
  if(r.sure||r.zorluk) lines.push([r.sure&&`⏱ ${r.sure}`, r.zorluk].filter(Boolean).join(" · "));
  lines.push("", "Malzemeler:", ...(r.malzemeler||[]).map(m=>`• ${m}`));
  lines.push("", "Yapılışı:", ...(r.adimlar||[]).map((a,i)=>`${i+1}. ${a}`));
  lines.push("", `Bu tarifi "Dolapta Ne Var?" buldu 👉 ${location.origin}`);
  return lines.join("\n");
}
async function shareRecipe(r){
  const text = recipeText(r);
  if(navigator.share){
    try { await navigator.share({ title: r.ad, text }); return; }
    catch(e){ if(e && e.name==="AbortError") return; }
  }
  window.open("https://wa.me/?text="+encodeURIComponent(text), "_blank");
}
function updateFavCount(){ $("#favCount").textContent = favs.length?`(${favs.length})`:""; }
function renderFavs(){
  const box = $("#favList");
  if(!favs.length){ box.innerHTML = `<div class="empty"><div class="e">✦</div><p>Henüz favorin yok.<br>Beğendiğin tariflerde kalbe dokun.</p></div>`; return; }
  box.innerHTML = favs.map((r,i)=>recipeCard(r,i,"favs")).join("");
  bindCards(box, favs);
}

$("#go").addEventListener("click", async ()=>{
  const res = $("#results");
  const btn = $("#go");
  btn.disabled = true;
  res.innerHTML = `<div class="status"><div class="spin"></div><p>Şef sizin için düşünüyor…<br><small style="font-size:14px">10-30 saniye sürebilir, sayfadan çıkma</small></p></div>`;
  try{
    const istek = () => fetch("/api/tarif", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ malzemeler: ingredients, tur: type, tercih: prefs })
    });
    let r;
    try { r = await istek(); }
    catch(_) {
      // Bağlantı koptuysa bir kez daha dene
      res.querySelector("p").textContent = "Bağlantı koptu, tekrar deniyorum...";
      try { r = await istek(); }
      catch(_) { throw new Error("Bağlantı koptu. İnternetini kontrol et; tarif hazırlanırken uygulamadan çıkma ve tekrar dene."); }
    }
    const data = await r.json().catch(()=>({}));
    if(!r.ok && !data.hata) throw new Error(`Sunucu hatası (${r.status}). Biraz sonra tekrar dene.`);
    if(!r.ok) throw new Error(data.hata || "Bir şeyler ters gitti, lütfen tekrar dene.");
    lastRecipes = data.tarifler;
    if(!Array.isArray(lastRecipes) || !lastRecipes.length) throw new Error("Tarif bulunamadı, başka malzemelerle dene.");
    res.innerHTML = `<p class="lead">Şefin önerileri</p>` +
      lastRecipes.map((r,i)=>recipeCard(r,i,"find")).join("");
    bindCards(res, lastRecipes);
  }catch(e){
    res.innerHTML = `<div class="err">${esc(e.message || "Bağlantı hatası, internetini kontrol et.")}</div>`;
  }
  btn.disabled = ingredients.length===0;
});

// --- Tercihler (bu telefonda hatırlanır) ---
const DIYET = ["vejetaryen","vegan","glütensiz","şekersiz","laktozsuz","çocuk dostu"];
const SURE = [[0,"Fark etmez"],[15,"15 dk"],[30,"30 dk"],[60,"1 saat"]];
let prefs = { kisi: 2, diyet: [], sure: 0 };
try { prefs = Object.assign(prefs, JSON.parse(localStorage.getItem("tercihler") || "{}")); } catch(e) {}
const savePrefs = () => { try { localStorage.setItem("tercihler", JSON.stringify(prefs)); } catch(e) {} };
const buyukHarf = t => t.charAt(0).toLocaleUpperCase("tr") + t.slice(1);
function renderPrefs(){
  $("#kisiSay").textContent = prefs.kisi + " kişi";
  $("#diyetler").innerHTML = DIYET.map(d => `<button type="button" class="opt ${prefs.diyet.includes(d)?"on":""}" data-d="${d}">${buyukHarf(d)}</button>`).join("");
  $("#sureler").innerHTML = SURE.map(([v,t]) => `<button type="button" class="opt ${prefs.sure===v?"on":""}" data-s="${v}">${t}</button>`).join("");
  const oz = [prefs.kisi + " kişi", ...prefs.diyet.map(buyukHarf), prefs.sure ? `≤ ${prefs.sure} dk` : ""].filter(Boolean);
  $("#prefOzet").textContent = oz.slice(0,3).join(" · ") + (oz.length > 3 ? " …" : "");
}
$("#kisiAz").addEventListener("click", () => { prefs.kisi = Math.max(1, prefs.kisi - 1); savePrefs(); renderPrefs(); });
$("#kisiCok").addEventListener("click", () => { prefs.kisi = Math.min(12, prefs.kisi + 1); savePrefs(); renderPrefs(); });
$("#diyetler").addEventListener("click", e => {
  const d = e.target.dataset.d; if (!d) return;
  prefs.diyet = prefs.diyet.includes(d) ? prefs.diyet.filter(x => x !== d) : [...prefs.diyet, d];
  savePrefs(); renderPrefs();
});
$("#sureler").addEventListener("click", e => {
  if (e.target.dataset.s === undefined) return;
  prefs.sure = +e.target.dataset.s; savePrefs(); renderPrefs();
});

// --- Alışveriş listesi ---
let shop = [];
try { shop = JSON.parse(localStorage.getItem("alisveris") || "[]"); } catch(e) {}
const saveShop = () => { try { localStorage.setItem("alisveris", JSON.stringify(shop)); } catch(e) {} updateShopCount(); };
function updateShopCount(){ const n = shop.filter(x => !x.ok).length; $("#shopCount").textContent = n ? `(${n})` : ""; }
function listeyeEkle(adlar, tarif){
  let n = 0;
  adlar.map(a => String(a).trim()).filter(Boolean).forEach(a => {
    if (!shop.some(x => x.ad.toLocaleLowerCase("tr") === a.toLocaleLowerCase("tr") && !x.ok)) { shop.push({ ad: a, tarif: tarif || "", ok: false }); n++; }
  });
  saveShop(); return n;
}
function renderShop(){
  const ul = $("#shopList");
  ul.innerHTML = shop.length ? shop.map((x,i) => `<li class="${x.ok?"done":""}">
      <button class="box" data-i="${i}" aria-label="Alındı">${x.ok?"✓":""}</button>
      <span class="nm" data-i="${i}">${esc(x.ad)}${x.tarif?`<small>${esc(x.tarif)} için</small>`:""}</span>
      <button class="del" data-del="${i}" aria-label="Sil">✕</button></li>`).join("")
    : `<li style="justify-content:center;color:var(--muted);border:0">Listen boş. Tariflerdeki eksikleri 🛒 ile ekleyebilirsin.</li>`;
  $("#shopBar").hidden = !shop.length;
}
$("#shopList").addEventListener("click", e => {
  const d = e.target.closest("[data-del]"), t = e.target.closest("[data-i]");
  if (d) shop.splice(+d.dataset.del, 1);
  else if (t) shop[+t.dataset.i].ok = !shop[+t.dataset.i].ok;
  else return;
  saveShop(); renderShop();
});
$("#shopForm").addEventListener("submit", e => {
  e.preventDefault(); listeyeEkle($("#shopIn").value.split(","), ""); $("#shopIn").value = ""; renderShop();
});
$("#shopClear").addEventListener("click", () => { shop = shop.filter(x => !x.ok); saveShop(); renderShop(); });
$("#shopShare").addEventListener("click", async () => {
  const text = "🛒 Alışveriş listem\n\n" + shop.filter(x => !x.ok).map(x => "• " + x.ad).join("\n") + `\n\n"Dolapta Ne Var?" ile hazırlandı 👉 ${location.origin}`;
  if (navigator.share) { try { await navigator.share({ title: "Alışveriş listem", text }); return; } catch(e) { if (e && e.name === "AbortError") return; } }
  window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");
});

// --- Adım adım pişirme modu ---
let cook = null, kilit = null, sayac = null;
async function ekranAcik(){
  try { if ("wakeLock" in navigator) { kilit = await navigator.wakeLock.request("screen"); $("#cookWake").textContent = "Ekran açık kalacak ☀︎"; return; } } catch(e) {}
  $("#cookWake").textContent = "";
}
document.addEventListener("visibilitychange", () => { if (cook && document.visibilityState === "visible") ekranAcik(); });
function dakikaBul(t){
  const m = String(t).match(/(\d+)\s*(?:-\s*\d+\s*)?(dakika|dk|saat)/i);
  if (!m) return 0;
  return (+m[1]) * (/saat/i.test(m[2]) ? 60 : 1);
}
function zamanlayiciDurdur(){ clearInterval(sayac); sayac = null; }
function cookGoster(){
  const { r, i } = cook, adim = r.adimlar || [];
  $("#cookAd").textContent = r.ad;
  $("#cookNo").textContent = `Adım ${i+1} / ${adim.length}`;
  $("#cookTxt").textContent = adim[i] || "";
  $("#cookBar").style.width = ((i+1) / adim.length * 100) + "%";
  $("#cookPrev").disabled = i === 0;
  $("#cookNext").textContent = i === adim.length - 1 ? "Afiyet olsun ✦" : "İleri ›";
  zamanlayiciDurdur();
  const dk = dakikaBul(adim[i]); const t = $("#cookTimer");
  t.hidden = !dk || dk > 240; t.classList.remove("run");
  t.textContent = `⏱ ${dk} dakikalık zamanlayıcı`; t.dataset.dk = dk;
}
$("#cookTimer").addEventListener("click", () => {
  const t = $("#cookTimer");
  if (sayac) { zamanlayiciDurdur(); t.classList.remove("run"); t.textContent = `⏱ ${t.dataset.dk} dakikalık zamanlayıcı`; return; }
  let kalan = +t.dataset.dk * 60; t.classList.add("run");
  const yaz = () => t.textContent = `${String(Math.floor(kalan/60)).padStart(2,"0")}:${String(kalan%60).padStart(2,"0")} · durdur`;
  yaz();
  sayac = setInterval(() => {
    kalan--; yaz();
    if (kalan <= 0) { zamanlayiciDurdur(); t.classList.remove("run"); t.textContent = "🔔 Süre doldu!"; try { navigator.vibrate && navigator.vibrate([400,200,400,200,400]); } catch(e) {} }
  }, 1000);
});
function pisir(r){
  if (!(r.adimlar||[]).length) return;
  cook = { r, i: 0 }; cookGoster(); $("#cook").hidden = false; document.body.style.overflow = "hidden"; ekranAcik();
}
function cookKapat(){
  zamanlayiciDurdur(); cook = null; $("#cook").hidden = true; document.body.style.overflow = "";
  try { kilit && kilit.release(); } catch(e) {} kilit = null;
}
$("#cookX").addEventListener("click", cookKapat);
$("#cookPrev").addEventListener("click", () => { if (cook.i > 0) { cook.i--; cookGoster(); } });
$("#cookNext").addEventListener("click", () => { if (cook.i < cook.r.adimlar.length - 1) { cook.i++; cookGoster(); } else cookKapat(); });

renderPrefs(); updateShopCount();
renderChips(); updateFavCount();

// --- Fotoğraftan malzeme tanıma ---
function kucult(file, max = 1280){
  return new Promise((ok, no) => {
    const img = new Image();
    img.onload = () => {
      const o = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * o); c.height = Math.round(img.height * o);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      ok(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = () => no(new Error("Fotoğraf açılamadı."));
    img.src = URL.createObjectURL(file);
  });
}
$("#cam").addEventListener("click", () => $("#camFile").click());
$("#camFile").addEventListener("change", async e => {
  const file = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!file) return;
  const btn = $("#cam"), note = $("#camNote"), yazi = btn.querySelector("span");
  btn.disabled = true; yazi.textContent = "Fotoğraf inceleniyor…";
  note.className = "camnote"; note.textContent = "Birkaç saniye sürebilir, sayfadan çıkma.";
  try {
    const resim = await kucult(file);
    const r = await fetch("/api/malzeme", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ resim }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.hata || "Fotoğraf okunamadı, tekrar dene.");
    const yeni = (d.malzemeler || []).filter(m => !ingredients.includes(m));
    if (!d.malzemeler || !d.malzemeler.length) {
      note.className = "camnote err"; note.textContent = "Fotoğrafta malzeme göremedim. Daha yakından ve aydınlık çekmeyi dene.";
    } else {
      addIng(yeni.join(","));
      note.className = "camnote ok";
      note.textContent = yeni.length ? `✓ ${yeni.length} malzeme eklendi. Yanlış olanı ✕ ile silebilirsin.` : "Bu malzemeler zaten listende.";
      window.va && window.va("event", { name: "foto_malzeme", count: yeni.length });
    }
  } catch (err) {
    note.className = "camnote err"; note.textContent = err.message || "Bağlantı hatası, tekrar dene.";
  }
  btn.disabled = false; yazi.textContent = "Dolabın fotoğrafını çek";
});

// --- Giriş ekranı: dokununca ya da 3,5 sn sonra kaybolur ---
(function(){
  const intro = $("#intro");
  let done = false;
  const kapat = () => {
    if (done) return; done = true;
    intro.classList.add("gone");
    document.querySelector('meta[name="theme-color"]').content = "#FFF8F0";
    setTimeout(() => intro.remove(), 900);
  };
  intro.addEventListener("click", kapat);
  setTimeout(kapat, 3500);
})();

// --- Telefona yükleme (PWA) ---
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(()=>{}));
}
const installBtn = $("#install");
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault(); deferredPrompt = e;
  if (!standalone) installBtn.classList.add("show");
});
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
if (isIOS && !standalone) {
  installBtn.innerHTML = `📲 Ana ekrana ekle<small>Safari'de alttaki Paylaş ⬆️ düğmesine, sonra “Ana Ekrana Ekle”ye dokun.</small>`;
  installBtn.classList.add("show");
}
installBtn.addEventListener("click", async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice.catch(()=>{});
  deferredPrompt = null; installBtn.classList.remove("show");
});
window.addEventListener("appinstalled", () => installBtn.classList.remove("show"));
</script>
</body>
</html>
